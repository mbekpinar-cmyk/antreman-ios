name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Antreman.xcodeproj \
            -scheme Antreman \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|isolated)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Antreman.app

      - name: Show errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Antreman.app
          ls "$APP/PlugIns"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Antreman.ipa Payload && ls -lh Antreman.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Antreman-ipa
          path: out/Antreman.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Antrenman build ${{ github.run_number }}
          body: |
            İmzasız IPA — Sideloadly / AltStore ile ücretsiz Apple ID kullanarak yükle.
            Commit: ${{ github.sha }}
          files: out/Antreman.ipa
          make_latest: true
