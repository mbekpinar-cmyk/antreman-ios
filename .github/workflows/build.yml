name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST"; fi
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Antreman.xcodeproj \
            -scheme Antreman \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|isolated)|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Antreman.app

      - name: Show errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || true

      - name: Verify bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/Antreman.app
          EXT="$APP/PlugIns/AntremanWidget.appex"
          set -e
          test -f "$APP/Web/index.html"
          test -d "$EXT"
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" "$APP/Info.plist" | grep -q true
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT/Info.plist" | grep -q widgetkit
          test -f "$APP/Metadata.appintents/extract.actionsdata"
          {
            echo "### Paket kontrolu"
            xcodebuild -version | head -1
            echo "- Uygulama: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist") / iOS $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")+"
            echo "- Widget: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
            echo "- Web/index.html: $(wc -c < "$APP/Web/index.html") bayt"
            echo "- App Intents: $(grep -o 'AddRestTimeIntent\|EndRestIntent' "$APP/Metadata.appintents/extract.actionsdata" | sort -u | tr '\n' ' ')"
            echo "- Uyari sayisi: $(grep -c 'warning:' build.log || true)"
          } | tee manifest.md

      - name: Embed entitlements (ad-hoc)
        run: |
          APP=build/Build/Products/Release-iphoneos/Antreman.app
          codesign --force --sign - "$APP/PlugIns/AntremanWidget.appex"
          codesign --force --sign - --entitlements App/Antreman.entitlements "$APP"
          codesign -d --entitlements - --xml "$APP" | plutil -p - | tee -a manifest.md

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Antreman.app
          ls "$APP/PlugIns"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Antreman.ipa Payload && ls -lh Antreman.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Antreman-ipa
          path: out/Antreman.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Antrenman build ${{ github.run_number }}
          body_path: manifest.md
          files: out/Antreman.ipa
          make_latest: true
