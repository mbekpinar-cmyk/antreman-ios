name: Shortcut

on:
  push:
    branches: [main]
    paths: ["shortcut/**", ".github/workflows/shortcut.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign
        run: |
          python3 shortcut/make_shortcut.py unsigned.shortcut
          sw_vers | tr '\n' ' ' | sed 's/^/::notice::/'; echo
          for mode in anyone people-who-know-me; do
            if OUT=$(shortcuts sign --mode $mode --input unsigned.shortcut --output "Antrenman-Saglik.shortcut" 2>&1); then
              echo "::notice::imza tamam ($mode)"; ls -l *.shortcut; exit 0
            fi
            echo "::error::imza basarisiz ($mode): $(echo "$OUT" | tr '\n' ' ' | cut -c1-600)"
          done
          exit 1
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shortcut-${{ github.run_number }}
          name: Antrenman Sağlık kestirmesi ${{ github.run_number }}
          body: Safari'de aç → Add Shortcut.
          files: Antrenman-Saglik.shortcut
          make_latest: false
