    {n:9, l:T("Çok zor<br>1 kaldı")},
    {n:10,l:T("Maks.<br>yapamazdım")},
  ];
  const btns = opts.map(o=>`<button onclick="enterRpe(${o.n})"><span class="n">${o.n}</span><span class="l">${o.l}</span></button>`).join("");
  const curRpe = en.rpe[padTarget.setIdx];
  const head = curRpe != null
    ? T("Set {i} — düzelt (şu an RPE {v})",{i:padTarget.setIdx+1,v:curRpe})
    : T("Set {i} — Ne kadar zorlandın?",{i:padTarget.setIdx+1});
  return `<div class="rpepanel">
    <div class="head">${head}</div>
    <div class="rpegrid">${btns}</div>
    <div class="skipline"><button class="tinylink" onclick="skipRpe()">${T("RPE'siz devam et")}</button></div>
  </div>`;
}

window.enterRep = function(v){
  const en = live.entries[detailExId];
  const ex = findEx(detailExId);
  const wasEmpty = en.reps[padTarget.setIdx] == null;
  en.reps[padTarget.setIdx] = v;
  if(wasEmpty){
    delete en.wuStep;                         // calisma setine baslandi — kart calisma adimina gecsin
    if(padTarget.setIdx > 0) delete en.bumpOffer;   // oneriye cevap vermeden devam etti
    /* Setler arasi GERCEK sureyi pasif olarak not al. rest[i] = i. setten
       onceki bekleme. Duzeltmelerde olcum yapilmaz, sayac da baslamaz. */
    const now = Date.now();
    if(!Array.isArray(en.rest)) en.rest = [];
    if(en.lastAt && padTarget.setIdx > 0){
      const gap = Math.round((now - en.lastAt)/1000);
      /* 20 dk ustu = telefonu birakmis, olcum anlamsiz */
      if(gap > 0 && gap < 1200) en.rest[padTarget.setIdx] = gap;
    }
    en.lastAt = now;
  }
  save();
  if(wasEmpty){
    /* yeni set girisi — mola baslat ve RPE'ye gec */
    native("haptic", {style:"light"});
    startRest(REST[ex.type] || 90, ex.n);
    padTarget.mode = 'rpe';
  }
  /* duzeltme ise: mola baslatma, ekranda kal ki sonucu gorebilsin */
  render();
};
window.clearRep = function(){
  const en = live.entries[detailExId];
  en.reps[padTarget.setIdx] = null;
  en.rpe[padTarget.setIdx] = null;
  if(padTarget.setIdx === 0) delete en.bumpOffer;
  save();
  padTarget.mode = 'reps';
  render();
};
window.moreReps = function(){
  const v = prompt(T("Tekrar sayısı:"));
  if(v==null) return;
  const n = parseInt(v,10);
  if(isNaN(n) || n<0) return;
  if(n>200){ alert(T("Bu sayı fazla yüksek görünüyor. En fazla 200 girebilirsin.")); return; }
  enterRep(n);
};
window.enterRpe = function(v){
  const en = live.entries[detailExId];
  const ex = findEx(detailExId);
  en.rpe[padTarget.setIdx] = v;
  if(padTarget.setIdx === 0){
    if(canOfferBump(ex, en)){
      const to = bumpTarget(ex, en.kg);
      if(to != null && to > en.kg + 0.001) en.bumpOffer = {to};
      else delete en.bumpOffer;
    } else delete en.bumpOffer;
  }
  save();
  // advance to next open set
  const nextIdx = en.reps.findIndex(r => r == null);
  if(nextIdx >= 0){
    padTarget.setIdx = nextIdx;
    padTarget.mode = 'reps';
  } else {
    padTarget.mode = 'reps';
  }
  render();
};
window.skipRpe = function(){
  const en = live.entries[detailExId];
  const nextIdx = en.reps.findIndex(r => r == null);
  if(nextIdx >= 0){
    padTarget.setIdx = nextIdx;
    padTarget.mode = 'reps';
  }
  render();
};

/* =========================================================
   FINISH SESSION
   ========================================================= */
window.finishSession = function(){
  const wo = PROGRAM[live.w];
  const any = wo.ex.some(ex => live.entries[ex.id].reps.some(r=>r!=null));
  if(!any){ live=null; stopRest(); view="home"; render(); return; }

  const durationSec = Math.round((Date.now() - live.startTime)/1000);
  const durationMin = Math.round(durationSec/60);
  const rec = { date:todayISO(), w:live.w, entries:{}, duration: durationMin, durationSec };
  const changes = [];
  wo.ex.forEach(ex => {
    const en = live.entries[ex.id];
    rec.entries[ex.id] = { kg:en.kg, reps:en.reps.slice(), rpe:en.rpe.slice() };
    if(Array.isArray(en.rest) && en.rest.some(v=>v!=null)) rec.entries[ex.id].rest = en.rest.slice();
    if(en.bumpFrom != null && en.kg != null && Math.abs(en.bumpFrom - en.kg) > 0.001) rec.entries[ex.id].bumpedFrom = en.bumpFrom;
    if(ex.type === "bw") return;
    if(en.reps.every(r=>r==null)) return;
    /* Ilerleme, PLANLANAN degil GERCEKTEN kaldirilan kiloya gore hesaplanir */
    const lifted = en.kg != null ? en.kg : S.weights[ex.id];
    const next = progressDecision(ex, en.reps, en.rpe, lifted, {entry:null}).weight;
    const rpeVals = en.rpe.filter(v=>v!=null);
    const avgRpe = rpeVals.length ? Math.round(rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length*10)/10 : null;
    if(next != null){
      changes.push({n:ex.n, from:lifted, to:next, avgRpe});
      S.weights[ex.id] = next;
    }
  });
  S.sessions.push(rec);
  S.nextIdx = (S.nextIdx + 1) % 3;
  live = null;              // once temizle, sonra kaydet — yoksa bitmis antrenman
  save();                   // "yarim kalmis" olarak geri gelir

  const totalVol = sessionVolume(rec);
  const totalSets = sessionSets(rec);
  doneSummary = { workoutName: wo.name, durationMin, durationSec, totalVol, totalSets, changes };
  live = null;
  stopRest();
  view = "done";
  render();
};

function renderDone(){
  const d = doneSummary;
  const timeStr = d.durationSec != null ? fmtDur(d.durationSec) : d.durationMin + "<small>"+T("dk")+"</small>";

  const perfRows = d.changes.map(c=>{
    const up = c.to > c.from;
    const same = c.to === c.from;
    return `<div class="perfrow">
      <div>${esc(c.n)}</div>
      <div class="chg ${same?'same':up?'up':'dn'}">
        ${same? T('Aynı —') : (up?'+':'')+fmtKg(c.to-c.from)+' kg '+(up?'↑':'↓')}
      </div>
    </div>`;
  }).join("");

  $app.innerHTML = `
    <div class="donewrap">
      ${doneBadgeSVG()}
      <div class="donetitle">${T("Antrenman Tamamlandı")}</div>
      <div class="donesub">${esc(d.workoutName)} · ${T("Aferin!")}</div>
      <div class="donestats">
        <div class="donestat"><div class="k">${T("Süre")}</div><div class="v">${timeStr}</div></div>
        <div class="donestat"><div class="k">${T("Toplam Set")}</div><div class="v">${d.totalSets}</div></div>
        <div class="donestat"><div class="k">${T("Toplam Hacim")}</div><div class="v">${Math.round(d.totalVol).toLocaleString(LOCALE[LANG])}<small> kg</small></div></div>
      </div>
    </div>
    ${perfRows ? `<div class="tbl-label">${T("Performans Özeti")}</div>
    <div class="perfblock">${perfRows}</div>` : ''}
    <button class="btn" onclick="doneSummary=null; go('home')">${T("ANA SAYFAYA DÖN")}</button>
  `;
}

function doneBadgeSVG(){
  // scalloped seal + check + rays, all in amber
  const cx=65, cy=65, rOut=38, rIn=34, n=12;
  let path="";
  for(let i=0;i<n*2;i++){
    const ang=(i/(n*2))*Math.PI*2 - Math.PI/2;
    const r = i%2===0 ? rOut : rIn;
    const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
    path += (i===0?'M':'L')+x.toFixed(1)+' '+y.toFixed(1);
  }
  path+="Z";
  let rays="";
  const rayA=[[-60,52],[-30,58],[30,58],[60,52],[-75,44],[75,44]];
  rayA.forEach(([deg,dist])=>{
    const a=deg*Math.PI/180 - Math.PI/2;
    const x1=cx+Math.cos(a)*dist, y1=cy+Math.sin(a)*dist;
    const x2=cx+Math.cos(a)*(dist+9), y2=cy+Math.sin(a)*(dist+9);
    rays+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--amber)" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>`;
  });
  return `<div class="donebadge"><svg class="badge" viewBox="0 0 130 130">
    <circle cx="${cx}" cy="${cy}" r="46" fill="var(--amber-glow)"/>
    <path d="${path}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${cx}" cy="${cy}" r="27" fill="var(--amber)"/>
    <polyline points="53 66 61 74 78 55" fill="none" stroke="#17130A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    ${rays}
  </svg></div>`;
}

/* =========================================================
   HISTORY
   ========================================================= */
/* Bu hareketin bir onceki seansina gore degisim.
   Takvimdeki onceki antrenmanla degil — ayni hareketin son kaydiyla kiyaslar. */
function prevEntry(exId, beforeIdx){
  for(let i=beforeIdx-1;i>=0;i--){
    const e = S.sessions[i].entries[exId];
    if(e) return e;
  }
  return null;
}
/* O oturumda agirligin neden degistigini/degismedigini aciklar —
   progress() ile ayni kurallari geriye donuk okur, yeni veri saklamaz. */
function decisionNote(ex, e, noNext){
  if(ex.type === "bw" || e.kg == null) return "";
  const d = progressDecision(ex, e.reps, e.rpe, e.kg, {entry:e});
  const rpeTxt = d.avgRpe != null ? " " + T("(Ort. RPE {v})",{v:d.avgRpe}) : "";
  /* Sonucu acikca yaz: bu performansin ardindan agirlik ne oldu.
     Boylece notun hangi antrenmana ait oldugu tartismasiz olur.
     noNext: gecmis listesinde zincir zaten "sonraki"yi gosteriyor. */
  const to = (!noNext && d.weight != null) ? "→ " + T("sonraki:") + " " + fmtKg(d.weight) + " kg" : "";
  const rng = `${d.worst}/${d.minReps}-${d.maxReps}${rpeTxt}`;
  let out = "";

  switch(d.tier){
    case "deload":
      out = T("Son set hedefi ({t} tekrar) tutmadı, {last} kaldı {to} (%10 azaltıldı)",{t:ex.target,last:d.last,to}); break;
    case "recalibrate":
      out = T("Hedefin {r} katından fazla tekrar çıktın ({last}/{t}) {to} (performansına göre yeniden hesaplandı)",{r:Math.round(d.ratio),last:d.last,t:ex.target,to}); break;
    case "bigjump":
      out = T("Hedefin {r} katı tekrar çıktın ({last}/{t}) {to} (çift artış)",{r:Math.round(d.ratio*10)/10,last:d.last,t:ex.target,to}); break;
    case "hold_high_rpe":
      out = T("Hedefi tutturdun ama zorlanma yüksekti{rpe} {to} (sabit tutuldu)",{rpe:rpeTxt,to}); break;
    case "double_low_rpe":
      out = T("Hedefi rahat tutturdun{rpe} {to} (çift artış)",{rpe:rpeTxt,to}); break;
    case "easy_jump":
      out = d.streak > 1
        ? T("Setler yine kolay geldi{rpe} — üst üste {n}. kolay seans {to} (+%{p} hızlandırılmış artış)",{rpe:rpeTxt,n:d.streak,to,p:Math.round((d.weight/e.kg - 1)*100)})
        : T("Setler kolay geldi{rpe} {to} (+%{p} hızlandırılmış artış)",{rpe:rpeTxt,to,p:Math.round((d.weight/e.kg - 1)*100)}); break;
    case "normal":
      out = T("Hedefi ({t}+ tekrar) tutturdun{rpe} {to}",{t:ex.target,rpe:rpeTxt,to}); break;
    case "hold_weak_sets":
      out = T("Son set hedefi tuttu ama ilk setler çok düştü ({w} — hedef {t}) {to} (bu ağırlık henüz oturmadı, aynı kiloda tekrar dene)",{w:d.weakReps.join(", "),t:ex.target,to}); break;
    case "coarse_step_up":
      out = T("Tüm setler {max} tekrarı tuttu{rpe} {to} (bir kademe atlandı, hedef {min} tekrara döner)",{max:d.maxReps,rpe:rpeTxt,to,min:d.minReps}); break;
    case "coarse_hold":
      out = d.topOfLadder
        ? T("Aralığın tepesindesin ve pim listesinin de en üstündesin{rpe} {to} (daha yüksek pim yok)",{rpe:rpeTxt,to})
        : T("Aralığın tepesindesin ama zorlanma yüksekti{rpe} {to} (kademe atlamak için bir hafta daha)",{rpe:rpeTxt,to}); break;
    case "coarse_rep_up":
      out = T("En zayıf setin {worst}/{max} tekrar{rpe} — makine kademesi {step} kg olduğu için ağırlık değil tekrar artıyor (sonraki hedef {nt})",{worst:d.worst,max:d.maxReps,rpe:rpeTxt,step:fmtKg(d.step),nt:d.nextTarget}); break;
    case "coarse_partial":
      out = T("Setler eksik kaldı {to} (sonraki hedef {nt} tekrar)",{to,nt:d.nextTarget}); break;
    case "acc_missed":
      out = T("Bir sette en az {min} tekrar gerekiyordu, en düşük setin {worst} oldu {to} (sabit kaldı, deload yok)",{min:d.minReps,worst:d.worst,to}); break;
    case "acc_hold":
      out = T("Sınırda tutturdun ama zorlanma yüksekti ({rng}) {to} (sabit tutuldu)",{rng,to}); break;
    case "acc_small":
      out = T("Hedefi tutturdun, aralığın altına yakın kaldın ({rng}) {to} (küçük artış)",{rng,to}); break;
    case "acc_normal":
      out = T("Her sette hedefi tutturdun ({rng}) {to}",{rng,to}); break;
    case "acc_big":
      out = T("Aralığın tepesine yakın ve rahat çıktın ({rng}) {to} (büyük artış)",{rng,to}); break;
    default:
      return "";
  }
  return out.replace(/\s{2,}/g," ").replace(/\s+\)/g, ")").trim();
}

/* Iki deger arasindaki yonu ok + renk sinifi olarak verir.
   Renk tek basina tasiyici degil: ok yonu de bilgiyi taşır. */
function dirOf(from, to){
  if(from == null || to == null) return { ar:"→", cls:"fl" };
  const d = Math.round((to - from)*100)/100;
  if(d > 0)  return { ar:"↗", cls:"up" };
  if(d < 0)  return { ar:"↘", cls:"dn" };
  return { ar:"→", cls:"fl" };
}

/* onceki ▸ bugun ▸ sonraki zinciri. Renkli olan sonraki adim —
   asil karar veremeyecegin degil, bir dahaki sefere kullanacagin kilo. */
function chainHtml(past, now, next, unit, fmt){
  const f = fmt || (v=>String(v));
  const u = unit ? ` <span style="font-size:10px;color:var(--faint)">${unit}</span>` : "";
  const d1 = dirOf(past, now);
  const d2 = dirOf(now, next);
  const hasPast = past != null;
  const hasNext = next != null;
  const cells = [];
  const labels = [];
  if(hasPast){
    cells.push(`<span class="v past">${f(past)}</span>`);
    cells.push(`<span class="ar ${d1.cls}">${d1.ar}</span>`);
    labels.push(`<span class="lb">${T("önceki")}</span>`, `<span></span>`);
  }
  cells.push(`<span class="v now">${f(now)}${u}</span>`);
  labels.push(`<span class="lb">${T("bugün")}</span>`);
  if(hasNext){
    cells.push(`<span class="ar ${d2.cls}">${d2.ar}</span>`);
    cells.push(`<span class="v ${d2.cls}">${f(next)}</span>`);
    labels.push(`<span></span>`, `<span class="lb ${d2.cls==='fl'?'':d2.cls}">${T("sonraki")}</span>`);
  }
  const cols = cells.length;
  return `<div class="hchain" style="grid-template-columns:repeat(${cols},auto)">
    ${cells.join("")}${labels.join("")}
  </div>`;
}

/* Setler arasi gercek dinlenme — pasif kaydedilir, ortalamasi gosterilir. */
function restLine(ex, e){
  const vals = (e.rest||[]).filter(v=>typeof v === "number" && v > 0);
  if(!vals.length) return "";
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const hedef = REST[ex.type] || 90;
  const uzun = avg > hedef*1.5;
  return `<div class="hrest">${T("dinl. ort.")} ${mmss(avg)}${uzun?` <span style="color:var(--amber)">· ${T("hedef")} ${mmss(hedef)}</span>`:''}</div>`;
}

function changeLine(ex, s, idx){
  const e = s.entries[ex.id]; if(!e) return "";
  const p = prevEntry(ex.id, idx);

  if(ex.type === "bw"){
    const cur = Math.max(0, ...(e.reps||[]).map(r=>r||0));
    const old = p ? Math.max(0, ...(p.reps||[]).map(r=>r||0)) : 0;
    if(!cur) return "";
    return chainHtml(old||null, cur, null, T("tekrar")) + restLine(ex, e);
  }

  if(e.kg == null) return "";
  const d = progressDecision(ex, e.reps, e.rpe, e.kg, {entry:e});
  const next = d && d.weight != null ? d.weight : null;
  const past = p && p.kg != null ? p.kg : null;
  /* Not artik "sonraki: X kg" tekrar etmiyor — zincir zaten soyluyor. */
  const noteClean = decisionNote(ex, e, true);
  const bumpTxt = e.bumpedFrom != null ? T("Seans içinde {a} → {b} kg artırıldı",{a:fmtKg(e.bumpedFrom),b:fmtKg(e.kg)}) : "";
  const noteHtml = (bumpTxt ? `<div class="hnote" style="color:var(--green)">▲ ${bumpTxt}</div>` : "")
                 + (noteClean ? `<div class="hnote">${noteClean}</div>` : "");
  return chainHtml(past, e.kg, next, "kg", fmtKg) + restLine(ex, e) + noteHtml;
}

function sessionAvgRpe(s){
  let sum=0, n=0;
  Object.values(s.entries).forEach(e=>{
    (e.rpe||[]).forEach(v=>{ if(v!=null){ sum+=v; n++; } });
  });
  return n ? Math.round(sum/n*10)/10 : null;
}

function renderHistoryScreen(){
  if(histSel && !S.sessions.length) histSel = null;
  document.body.classList.toggle("hselecting", !!histSel);
  if(!S.sessions.length){
    $app.innerHTML = `
      <div class="hero"><div class="name">${T("Antrenmanlar")}</div></div>
      <div class="card" style="text-align:center;padding:40px 20px">
        <div style="color:var(--muted);font-size:13px;line-height:1.6">
          ${T("Henüz antrenman kaydın yok.")}<br>${T("İlk antrenmanı tamamladığında burada görünecek.")}
        </div>
      </div>`;
    return;
  }
  const items = S.sessions.slice().reverse().map((s,ri)=>{
    const realIdx = S.sessions.length-1-ri;
    const wo = programOf(s.w);
    const vol = sessionVolume(s);
    const avgRpe = sessionAvgRpe(s);
    const selMode = !!histSel;
    const picked = selMode && histSel.has(realIdx);
    const expanded = !selMode && historyOpen === realIdx;
    const ids = wo.ex.map(e=>e.id).concat(Object.keys(s.entries).filter(id=>wo.ex.every(e=>e.id!==id)));
    const detailRows = expanded ? ids.map(id=>{
      const ex = findExAny(id); if(!ex) return "";
      const e = s.entries[id]; if(!e) return "";
      const reps = e.reps.map(r=>r==null?'—':r).join(' · ');
      return `<div class="hexrow">
        <div class="top">
          <div class="nm">${esc(ex.n)}${e.kg!=null?` <small>${fmtKg(e.kg)} kg</small>`:''}</div>
          <div class="rp">${reps}</div>
        </div>
        ${changeLine(ex, s, realIdx)}
      </div>`;
    }).join("") : "";
    if(selMode){
      return `<div class="hcard selmode${picked?' picked':''}" onclick="toggleHistPick(${realIdx})" role="checkbox" aria-checked="${picked}">
      <div class="hpick">${picked?iconSVG('check'):''}</div>
      <div class="hd">
        <div style="flex:1"><div class="n">${esc(wo.name)}</div>
          <div class="d">${trDateLong(s.date)}</div></div>
        <div style="text-align:right">
          <div class="v">${Math.round(vol).toLocaleString(LOCALE[LANG])} kg</div>
          ${avgRpe!=null?`<div class="hrpe">${T("Ort. RPE")} ${avgRpe}</div>`:''}
        </div>
      </div>
    </div>`;
    }
    return `<div class="hcard" onclick="toggleHist(${realIdx})">
      <div class="hd">
        <div style="flex:1"><div class="n">${esc(wo.name)}</div>
          <div class="d">${trDateLong(s.date)}</div></div>
        <div style="text-align:right">
          <div class="v">${Math.round(vol).toLocaleString(LOCALE[LANG])} kg</div>
          ${avgRpe!=null?`<div class="hrpe">${T("Ort. RPE")} ${avgRpe}</div>`:''}
        </div>
      </div>
      ${expanded ? detailRows : ''}
    </div>`;
  }).join("");
  const n = histSel ? histSel.size : 0;
  const bar = histSel ? `<div class="hselbar"><div class="in">
      <span class="cnt">${n ? T("{n} antrenman seçildi",{n}) : T("Silmek istediklerini seç")}</span>
      <button class="del" aria-disabled="${n?'false':'true'}" onclick="deletePickedSessions()">${iconSVG('trash')}${T("Sil")}</button>
    </div></div>` : "";
  $app.innerHTML = `
    <div class="hero hhead"><div class="name">${T("Antrenmanlar")}</div>
      <button class="hselbtn" onclick="toggleHistSelect()">${histSel ? T("İptal") : T("Seç")}</button></div>
    ${items}
    ${bar}
  `;
}
window.toggleHist = function(i){ historyOpen = historyOpen===i ? null : i; render(); };

/* ---- Gecmis antrenmanlari secip silme (galeri gibi) ---- */
let histSel = null;   // null = normal mod, Set = secim modu (gercek session index'leri)
window.toggleHistSelect = function(){ histSel = histSel ? null : new Set(); historyOpen = null; render(); };
window.toggleHistPick = function(i){
  if(!histSel) return;
  if(histSel.has(i)) histSel.delete(i); else histSel.add(i);
  render();
};
window.deletePickedSessions = function(){
  if(!histSel || !histSel.size) return;
  const n = histSel.size;
  const msg = n === 1 ? T("Bu antrenman silinecek. Bu geri alınamaz.\n\nSilinsin mi?")
                      : T("{n} antrenman silinecek. Bu geri alınamaz.\n\nSilinsin mi?",{n});
  if(!confirm(msg)) return;
  deleteSessions(histSel);
  histSel = null; historyOpen = null;
  render();
};

/* Silinen antrenmanlar "hic yapilmamis gibi" olsun:
   1) Bir hareketin EN SON kaydi silindiyse, o kaydin urettigi sonraki
      agirlik geri alinir — kalan gecmisteki son kayittan yeniden hesaplanir.
      Agirlik sonradan elle degistirildiyse (silinen kaydin urettigi degerle
      ayni degilse) dokunulmaz.
   2) En son antrenman(lar) silindiyse siradaki antrenman, silinenlerin
      ilki olur (C silindiyse sira yine C). */
function entryUsable(e){ return e && e.kg != null && Array.isArray(e.reps) && e.reps.some(r => r != null); }
function deleteSessions(idxSet){
  const del = new Set([...idxSet].filter(i => i >= 0 && i < S.sessions.length));
  if(!del.size) return;
  const lastIdx = S.sessions.length - 1;

  /* 1) agirlik geri alma — silmeden ONCE hesapla */
  const ids = new Set();
  del.forEach(i => Object.keys(S.sessions[i].entries || {}).forEach(id => ids.add(id)));
  ids.forEach(id => {
    const ex = findEx(id);
    if(!ex || ex.type === "bw") return;
    let latest = -1;
    for(let i = lastIdx; i >= 0; i--){ if(entryUsable(S.sessions[i].entries[id])){ latest = i; break; } }
    if(latest < 0 || !del.has(latest)) return;          // son kayit duruyor — agirlik zaten ona gore
    const e = S.sessions[latest].entries[id];
    const produced = progressDecision(ex, e.reps, e.rpe, e.kg, {entry:e}).weight;
    if(produced == null || S.weights[id] == null || Math.abs(S.weights[id] - produced) > 0.001) return;
    let prev = null, firstDel = e;
    for(let j = latest - 1; j >= 0; j--){
      const pe = S.sessions[j].entries[id];
      if(!entryUsable(pe)) continue;
      if(del.has(j)){ firstDel = pe; continue; }
      prev = pe; break;
    }
    const target = prev ? progressDecision(ex, prev.reps, prev.rpe, prev.kg, {entry:prev}).weight : firstDel.kg;
    if(target != null && target > 0) S.weights[id] = target;
  });

  /* 2) sira geri alma */
  if(del.has(lastIdx)){
    let k = lastIdx;
    while(k >= 0 && del.has(k)) k--;                    // k = kalan son antrenman
    const firstGone = S.sessions[k + 1];
    const oi = firstGone ? ORDER.indexOf(firstGone.w) : -1;
    if(oi >= 0) S.nextIdx = oi;
  }

  S.sessions = S.sessions.filter((_, i) => !del.has(i));
  save();
}

/* Bu hareketin gecmis agirlik/RPE serisini, en son antrenmanin
   ham reps/rpe verisiyle birlikte dondurur (decisionNote icin gerekli). */
function exerciseHistory(exId){
  const pts = [];
  S.sessions.forEach(s => {
    const e = s.entries[exId];
    if(!e || e.kg == null) return;
    const rpeVals = (e.rpe||[]).filter(v=>v!=null);
    const avgRpe = rpeVals.length ? rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length : null;
    pts.push({ date:s.date, kg:e.kg, avgRpe, entry:e });
  });
  return pts;
}

/* Bir hareketi siniflandirir: plato (takildi/dengelendi) ya da trend (hiz + 4hf tahmin). */
function classifyExercise(ex){
  const pts = exerciseHistory(ex.id);
  if(pts.length < 2) return null;

  const last = pts[pts.length-1];
  const inc = incOf(ex);

  /* Sondan geriye dogru ayni agirlikta kac antrenman gitmis */
  let flatCount = 1;
  for(let i=pts.length-2; i>=0; i--){
    if(Math.abs(pts[i].kg - last.kg) < 0.01) flatCount++; else break;
  }

  if(flatCount >= 3){
    const streak = pts.slice(pts.length-flatCount);
    const rpeVals = streak.map(p=>p.avgRpe).filter(v=>v!=null);
    const note = decisionNote(ex, last.entry);
    const lastDecision = progressDecision(ex, last.entry.reps, last.entry.rpe, last.kg, {entry:last.entry});
    /* "Takildi" etiketi, ham gecmis sayisina degil, GUNCEL kuralin bu
       performansi degerlendirince agirligi degistirip degistirmedigine
       bakar — cozulmus bir durumu yanlislikla alarm olarak gostermesin. */
    const stuck = lastDecision.weight === last.kg;
    return { id:ex.id, name:ex.n, status:'plateau', stuck, current:last.kg,
             flatCount, streak: rpeVals, note };
  }

  /* Trend: son (en fazla 4) noktadaki degisimlere bak */
  const win = pts.slice(-4);
  const deltas = [];
  for(let i=1;i<win.length;i++) deltas.push(win[i].kg - win[i-1].kg);
  if(!deltas.length) return null;
  const numFlat = deltas.filter(d=>Math.abs(d)<0.01).length;
  const avgDelta = deltas.reduce((a,b)=>a+b,0)/deltas.length;

  let speed = 'normal';
  if(numFlat >= 1) speed = 'slowing';
  else if(inc > 0 && avgDelta/inc >= 1.3) speed = 'fast';

  /* 4 haftalik tahmin: antrenman basina ortalama artis * bu hareketin
     4 haftada kac kez goruldugu (gercek tarih araliklarindan hesapla) */
  const span = (new Date(last.date) - new Date(pts[0].date)) / 86400000;
  const avgIntervalDays = pts.length > 1 ? span / (pts.length-1) : 7;
  const sessionsIn28 = avgIntervalDays > 0 ? Math.round(28/avgIntervalDays) : 4;
  const forecast = speed === 'slowing'
    ? mround(last.kg + avgDelta * sessionsIn28 * 0.5, ex.inc || 2.5)
    : mround(last.kg + avgDelta * sessionsIn28, ex.inc || 2.5);

  return { id:ex.id, name:ex.n, status:'trend', speed, current:last.kg,
           forecast: Math.max(forecast, last.kg) };
}

function progressGenel(){
  if(!S.sessions.length) return emptyState(T("Antrenman kaydettikçe burada özet oluşacak."));

  const items = allEx()
    .filter(ex => ex.type !== "bw")
    .map(classifyExercise)
    .filter(Boolean);

  const plateaus = items.filter(i => i.status === 'plateau');
  const stuckCount = plateaus.filter(i => i.stuck).length;
  const trends = items.filter(i => i.status === 'trend');

  /* Ustteki hero rakam: son 28 gunde ana/ikincil hareketlerde toplam kac kg artis */
  const cutoff = Date.now() - 28*86400000;
  let heroGain = 0;
  allEx().filter(ex=>["main","sec","sec4"].includes(ex.type)).forEach(ex=>{
    const pts = exerciseHistory(ex.id).filter(p=>new Date(p.date).getTime() >= cutoff);
    if(pts.length >= 2) heroGain += (pts[pts.length-1].kg - pts[0].kg);
  });

  /* Siralama: once dikkat isteyen platolar, sonra dengelenen platolar, sonra hiza gore trendler */
  plateaus.sort((a,b) => (b.stuck?1:0) - (a.stuck?1:0));
  const speedOrder = {fast:0, normal:1, slowing:2};
  trends.sort((a,b) => speedOrder[a.speed] - speedOrder[b.speed]);

  const speedLbl = {fast:'↗ '+T('hızlı'), normal:'↗ '+T('düzenli'), slowing:'→ '+T('yavaşlıyor')};
  const speedColor = {fast:'var(--green)', normal:'var(--green)', slowing:'var(--amber)'};

  const plateauCards = plateaus.map(p => {
    if(p.stuck){
      const bars = p.streak.map(v => `<div class="rpebar warn">${Math.round(v*10)/10}</div>`).join("");
      return `<div class="pcard warn" onclick="openExProgress('${p.id}')">
        <div class="pctop">
          <span class="pname">${esc(p.name)}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="ptag warn">${T("Takıldı")}</span>
            ${chevIcon()}
          </div>
        </div>
        <div class="pbig">${fmtKg(p.current)}<span class="punit">kg · ${T("{n} antrenmandır aynı",{n:p.flatCount})}</span></div>
        <div class="rpebars">${bars}</div>
        <div class="pnote">${p.note || T('Hedefi tutturuyorsun ama zorlanman sürekli yüksek. Sistem bu yüzden ağırlığı artırmıyor.')}</div>
      </div>`;
    }
    return `<div class="pcard" onclick="openExProgress('${p.id}')">
      <div class="pctop">
        <span class="pname">${esc(p.name)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="ptag flat">◆ ${T("dengelendi")}</span>
          ${chevIcon()}
        </div>
      </div>
      <div class="pmuted">${fmtKg(p.current)} kg · ${T("{n} antrenmandır aynı",{n:p.flatCount})}</div>
    </div>`;
  }).join("");

  const trendCards = trends.map(t => `
    <div class="tcard" onclick="openExProgress('${t.id}')">
      <div class="tctop">
        <span class="pname">${esc(t.name)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="tspeed" style="color:${speedColor[t.speed]}">${speedLbl[t.speed]}</span>
          ${chevIcon()}
        </div>
      </div>
      <div class="trow">
        <span class="tnum">${fmtKg(t.current)}</span>
        <div class="tline"></div>
        <span class="tnum accent">~${fmtKg(t.forecast)}</span>
        <span class="ttag">${T("4hf")}</span>
      </div>
    </div>`).join("");

  return `
    <div class="herostats">
      <div class="hs"><div class="hk">${T("4 hafta ilerleme")}</div>
        <div class="hv">${heroGain>=0?'+':''}${fmtKg(heroGain)}<small>kg</small></div></div>
      <div class="hs"><div class="hk">${T("Dikkat isteyen")}</div>
        <div class="hv" style="color:${stuckCount>0?'var(--amber)':'var(--text)'}">${stuckCount}</div></div>
    </div>
    ${plateaus.length ? `<div class="sectionlbl">${T("Hareketler")}</div>${plateauCards}` : ''}
    ${trendCards}
    ${!items.length ? emptyState(T("Birkaç antrenman sonra burada analiz görünecek.")) : ''}
  `;
}

function allLiftsChartCard(){
  const cutoffDays = {"3ay":90,"6ay":180,"1yil":365,"tumu":99999}[progressRange] || 99999;
  const cutoff = Date.now() - cutoffDays*86400000;

  // build per-exercise series (weight over time), machine/dumbbell only
  const exs = allEx().filter(e => e.type!=="bw");
  const seriesList = exs.map(ex => {
    const pts = seriesFor(ex.id).filter(p => new Date(p.date).getTime() >= cutoff);
    return { id:ex.id, name:ex.n, color:exLineColor(ex.id), pts };
  }).filter(s => s.pts.length >= 1);

  if(!seriesList.some(s => s.pts.length >= 2)){
    return `<div class="chartbox"><div class="hd"><div><div class="l">${T("Hareket Ağırlıkları")}</div></div></div>
      <div style="padding:16px 6px 20px;text-align:center;color:var(--muted);font-size:12px">${T("Grafik için en az 2 kayıtlı antrenman gerekli")}</div></div>`;
  }

  // collect all dates across visible (non-hidden) series for x-domain
  const visible = seriesList.filter(s => !hiddenSeries[s.id]);
  const activeForScale = visible.length ? visible : seriesList;

  let allDates = [];
  let mn = Infinity, mx = -Infinity;
  activeForScale.forEach(s => s.pts.forEach(p => {
    allDates.push(new Date(p.date).getTime());
    if(p.kg < mn) mn = p.kg;
    if(p.kg > mx) mx = p.kg;
  }));
  const tMin = Math.min(...allDates), tMax = Math.max(...allDates);
  if(!isFinite(mn)){ mn = 0; mx = 10; }
  if(mn === mx){ mn = Math.max(0, mn-5); mx = mx+5; }
  const padY = (mx-mn)*0.12; mn = Math.max(0, mn-padY); mx = mx+padY;

  const W=340, H=210, PL=34, PR=12, PT=14, PB=28;
  const iw=W-PL-PR, ih=H-PT-PB;
  const xOf = t => tMax===tMin ? PL+iw/2 : PL + ((t-tMin)/(tMax-tMin))*iw;
  const yOf = v => PT + ih - ((v-mn)/(mx-mn))*ih;

  // horizontal grid + y labels
  let grid = "";
  for(let i=0;i<=3;i++){
    const v = mn + (mx-mn)*(i/3);
    const y = yOf(v);
    grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity=".6"/>`;
    grid += `<text x="${PL-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)" font-weight="600">${Math.round(v)}</text>`;
  }
  // x labels: start / mid / end dates
  let xl = "";
  [tMin, (tMin+tMax)/2, tMax].forEach(t => {
    xl += `<text x="${xOf(t).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-weight="600">${trDate(new Date(t).toISOString().slice(0,10))}</text>`;
  });

  // one polyline per series
  let lines = "";
  seriesList.forEach(s => {
    if(hiddenSeries[s.id] || s.pts.length < 1) return;
    const d = s.pts.map((p,i)=>`${i?'L':'M'}${xOf(new Date(p.date).getTime()).toFixed(1)} ${yOf(p.kg).toFixed(1)}`).join(" ");
    lines += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    // dots
    s.pts.forEach(p => {
      lines += `<circle cx="${xOf(new Date(p.date).getTime()).toFixed(1)}" cy="${yOf(p.kg).toFixed(1)}" r="2.6" fill="var(--bg)" stroke="${s.color}" stroke-width="1.6"/>`;
    });
  });

  // legend chips (tap to toggle)
  const legend = seriesList.map(s => {
    const off = hiddenSeries[s.id];
    return `<button class="legchip ${off?'off':''}" onclick="toggleSeries('${s.id}')">
      <span class="dot" style="background:${off?'var(--faint)':s.color}"></span>${esc(s.name)}
    </button>`;
  }).join("");

  return `<div class="chartbox">
    <div class="hd"><div><div class="l">${T("Hareket Ağırlıkları")}</div><div class="sub2" style="margin-top:2px">${T("Zamanla her hareketin çalışma ağırlığı")}</div></div></div>
    <svg class="chartsvg" viewBox="0 0 ${W} ${H}">${grid}${lines}${xl}</svg>
    <div class="legend">${legend}</div>
  </div>`;
}

function progressEgzersizler(){

  const opts = list.map(e => `<option value="${e.id}" ${e.id===progressExId?'selected':''}>${esc(e.n)}</option>`).join("");

  const ranges = [
    {id:'3ay', l:T('3 Ay'), days:90},
    {id:'6ay', l:T('6 Ay'), days:180},
    {id:'1yil',l:T('1 Yıl'), days:365},
    {id:'tumu',l:T('Tümü'), days:99999},
  ];
  const rSeg = `<div class="rangeseg">${ranges.map(r=>
    `<button class="${progressRange===r.id?'on':''}" onclick="setRange('${r.id}')">${r.l}</button>`).join("")}</div>`;

  const rangeDays = ranges.find(r=>r.id===progressRange).days;
  const cutoff = Date.now() - rangeDays*86400000;
  const series = seriesFor(progressExId).filter(p => new Date(p.date).getTime() >= cutoff);

  const ex = findEx(progressExId);
  const rangeLbl = ranges.find(r=>r.id===progressRange).l;

  /* Kaba kademeli hareketlerde agirlik haftalarca duz gidip sonra basamak
     yapar — grafige bakinca plato saniliyor. Gercek ilerleme tekrarlarda
     oldugu icin bu hareketlerde HACIM cizdiriyoruz. */
  const coarseEx = isCoarse(ex);
  const chartSeries = coarseEx
    ? series.map(p => ({...p, kg: volumeOfEntry(progressExId, p.date)})).filter(p => p.kg > 0)
    : series;
  const chart = chartSeries.length >= 2
    ? bigLineChart(chartSeries, rangeLbl)
    : `<div class="chartbox"><div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">${T("Bu aralıkta yeterli veri yok")}</div></div>`;
  const coarseNote = coarseEx
    ? `<div style="font-size:11.5px;color:var(--muted);line-height:1.6;margin:-4px 2px 14px">
         ${T("Kademesi {st} kg — ağırlık her antrenman artmaz. Grafik <b>hacim</b> (kg × toplam tekrar) gösteriyor; asıl ilerleme orada.",{st:fmtKg(stepOf(ex))})}
       </div>`
    : '';

  const now = S.weights[progressExId];
  const start = series.length ? series[0].kg : now;
  const delta = now - start;
  /* Kaba kademede agirlik farki neredeyse hep 0 cikar — hacim farkini goster */
  const dChange = coarseEx && chartSeries.length >= 2
    ? chartSeries[chartSeries.length-1].kg - chartSeries[0].kg
    : delta;
  const bestOrm = series.reduce((m,p)=> p.e1rm!=null && p.e1rm>m ? p.e1rm : m, 0);
  const rpeVals = series.map(p=>p.rpe).filter(v=>v!=null);
  const avgRpe = rpeVals.length ? (rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length).toFixed(1) : "—";
  // success rate: sessions where target was hit
  let hits=0, tries=0;
  S.sessions.forEach(s=>{
    const e = s.entries[progressExId]; if(!e) return;
    tries++;
    if(ex.type==="main"||ex.type==="sec"||ex.type==="sec4"){
      if(e.reps[ex.sets-1] >= ex.target) hits++;
    } else if(ex.type==="acc"){
      const minReps = ex.min != null ? ex.min : Math.ceil((ex.total||0) / ex.sets);
      const filled = (e.reps||[]).filter(r=>r!=null);
      if(filled.length >= ex.sets && filled.every(r=>r >= minReps)) hits++;
    }
  });
  const rate = tries ? Math.round(hits/tries*100) : 0;
  // Ort. artış: kaç antrenmanda bir ağırlık artmış
  const allSer = seriesFor(progressExId);
  let incs = 0;
  for(let i=1;i<allSer.length;i++){ if(allSer[i].kg > allSer[i-1].kg) incs++; }
  const incRate = incs > 0 ? (()=>{ const s = (Math.round(allSer.length/incs*10)/10).toString(); return LANG==="en" ? s : s.replace(".",","); })() : null;

  return `
    <div class="pickbox">
      <select onchange="progressExId=this.value; render()">${opts}</select>
    </div>
    ${rSeg}
    ${chart}
    ${coarseNote}
    <div class="statgrid">
      <div><div class="k">${T("Tahmini 1RM")}</div><div class="v">${fmtKg(bestOrm)||'—'}<small>kg</small></div></div>
      <div><div class="k">${T("Başarı")}</div><div class="v">${rate}<small>%</small></div></div>
      <div><div class="k">${T("Ort. RPE")}</div><div class="v">${avgRpe}</div></div>
    </div>
    <div class="factrow">
      <div><div class="k">${T("Ort. Artış")}</div><div class="v">${incRate ? T("Her {n} antrenmanda",{n:incRate}) : '—'}</div></div>
      <div class="icon">↗</div>
    </div>
    <div class="factrow">
      <div><div class="k">${T("Toplam Değişim")}${coarseEx?' ('+T("hacim")+')':''}</div><div class="v" style="color:${dChange>=0?'var(--green)':'var(--red)'}">${dChange>=0?'+':''}${coarseEx?Math.round(dChange).toLocaleString(LOCALE[LANG]):fmtKg(dChange)} ${coarseEx?T('kg·tekrar'):'kg'}</div></div>
      <div class="icon">${dChange>=0?'↗':'↘'}</div>
    </div>
  `;
}

function bigLineChart(series, rangeLbl){
  const W=320, H=170, PL=32, PR=10, PT=14, PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vals = series.map(p=>p.kg);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){mn=Math.max(0,mn-5); mx=mx+5;}
  const pad=(mx-mn)*0.15; mn=Math.max(0,mn-pad); mx=mx+pad;
  const xOf = i => PL + (series.length<=1 ? iw/2 : (i/(series.length-1))*iw);
  const yOf = v => PT + ih - ((v-mn)/(mx-mn))*ih;

  let grid = "";
  for(let i=0;i<=3;i++){
    const v = mn + (mx-mn)*(i/3);
    const y = yOf(v);
    grid += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity=".7"/>`;
    grid += `<text x="${PL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)" font-weight="600">${Math.round(v)}</text>`;
  }

  const d = series.map((p,i)=>`${i?'L':'M'}${xOf(i).toFixed(1)} ${yOf(p.kg).toFixed(1)}`).join(" ");
  const area = `M${xOf(0).toFixed(1)} ${(PT+ih).toFixed(1)} ` +
    series.map((p,i)=>`L${xOf(i).toFixed(1)} ${yOf(p.kg).toFixed(1)}`).join(" ") +
    ` L${xOf(series.length-1).toFixed(1)} ${(PT+ih).toFixed(1)} Z`;
  const dots = series.map((p,i)=>`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.kg).toFixed(1)}" r="3.2" fill="var(--bg)" stroke="var(--amber)" stroke-width="2"/>`).join("");
  const step = Math.max(1, Math.ceil(series.length/5));
  const xl = series.map((p,i)=>(i%step===0||i===series.length-1)?
    `<text x="${xOf(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-weight="600">${trDate(p.date)}</text>`:'').join("");

  const now = series[series.length-1].kg;
  const first = series[0].kg;
  const delta = now-first;
  return `<div class="chartbox">
    <div class="hd">
      <div><div class="l">${T("Çalışma Ağırlığı")}</div><div class="big">${fmtKg(now)}<small>kg</small></div><div class="tag">${T("Mevcut")}</div></div>
      <div class="right"><div class="chg ${delta>=0?'up':'dn'}">${delta>=0?'+':''}${fmtKg(delta)} kg</div><div class="sub2">${T("Son {r}",{r:rangeLbl||''})}</div></div>
    </div>
    <svg class="chartsvg" viewBox="0 0 ${W} ${H}">
      ${grid}
      <path d="${area}" fill="var(--amber)" opacity=".08"/>
      <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${xl}
    </svg>
  </div>`;
}

function progressVucut(){
  const log = S.bwLog.slice().sort((a,b)=>a.date<b.date?-1:1);
  const first = log[0];
  const last = log[log.length-1];
  const diff = (first && last) ? last.kg - first.kg : 0;
  const chart = log.length >= 2 ? bwChart(log) : `<div class="chartbox"><div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">${T("Grafik için en az 2 kayıt gerekli")}</div></div>`;

    ${chart}
    ${rows ? `<div class="card"><div class="settbl-title" style="padding:0 0 6px">${T("Geçmiş")}</div>${rows}</div>` : ''}

}
function bwChart(log){
  const W=320,H=170,PL=32,PR=10,PT=14,PB=26;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vals=log.map(b=>b.kg);
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mn===mx){mn-=2;mx+=2;}
  const pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  const xOf=i=>PL+(log.length<=1?iw/2:(i/(log.length-1))*iw);
  const yOf=v=>PT+ih-((v-mn)/(mx-mn))*ih;
  let grid="";
  for(let i=0;i<=3;i++){
    const v=mn+(mx-mn)*(i/3), y=yOf(v);
    grid+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" opacity=".7"/>`;
    grid+=`<text x="${PL-4}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)" font-weight="600">${(Math.round(v*10)/10)}</text>`;
  }
  const d = log.map((b,i)=>`${i?'L':'M'}${xOf(i).toFixed(1)} ${yOf(b.kg).toFixed(1)}`).join(" ");
  const area = `M${xOf(0).toFixed(1)} ${(PT+ih).toFixed(1)} ` +
    log.map((b,i)=>`L${xOf(i).toFixed(1)} ${yOf(b.kg).toFixed(1)}`).join(" ") +
    ` L${xOf(log.length-1).toFixed(1)} ${(PT+ih).toFixed(1)} Z`;
  const dots = log.map((b,i)=>`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(b.kg).toFixed(1)}" r="3.2" fill="var(--bg)" stroke="var(--amber)" stroke-width="2"/>`).join("");
  const step = Math.max(1, Math.ceil(log.length/5));
  const xl = log.map((b,i)=>(i%step===0||i===log.length-1)?
    `<text x="${xOf(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-weight="600">${trDate(b.date)}</text>`:'').join("");
  const diff = log[log.length-1].kg - log[0].kg;
  return `<div class="chartbox">
    <div class="hd">
      <div><div class="l">${T("Vücut Ağırlığı")}</div><div class="r">${fmtKg(log[log.length-1].kg)}<small>kg</small></div></div>
      <div class="chg ${diff<0?'up':'dn'}">${diff>0?'+':''}${fmtKg(diff)} kg</div>
    </div>
    <svg class="chartsvg" viewBox="0 0 ${W} ${H}">
      ${grid}
      <path d="${area}" fill="var(--amber)" opacity=".1"/>
      <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${xl}
    </svg>
  </div>`;
}
window.logBw = function(){
  const v = pf(document.getElementById("newbw").value);

  S.bodyweight = v;

  if(ex) ex.kg = v; else S.bwLog.push({date:t, kg:v});
  save(); render();
};

function snapWeightToLadder(id){

function addRung(id, kg, silent){
  if(!(kg > 0) || kg > 1000) return false;
  if(!S.ladders) S.ladders = {};
  const l = (S.ladders[id] || []).slice();
  kg = r2(kg);
  if(l.indexOf(kg) === -1) l.push(kg);
  l.sort((a,b)=>a-b);
  S.ladders[id] = l;
  save();
  if(!silent) render();

}

  parts.forEach(p => { const n = pf(p); if(!addRung(id, n, true)) bad = true; });

   REST TIMER
   ========================================================= */
/* Sayac artik tik saymiyor: bitis ANI saklaniyor, kalan sure her
   cizimde gercek saatten hesaplaniyor. Baska uygulamaya gecince
   tarayici setInterval'i kissa da kissin, geri donunce rakam dogru. */
let restTimer = null, restEnd = 0, restTotal = 0, restLabel = "";
const mmss = s => `${Math.floor(s/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
function restLeftSec(){ return restEnd ? Math.max(0, Math.ceil((restEnd - Date.now())/1000)) : 0; }

/* ---- NATIVE (iOS uygulamasi) ----
   Uygulamanin icinde calisirken mola sayaci native tarafa da bildirilir:
   kilit ekrani + Dynamic Island'da canli sayac (Live Activity) ve mola
   bitince bildirim (telefon kilitliyken Apple Watch'a duser). Bu modda
   sessiz ses hilesine gerek yok — muzik hic kesilmez. */
function restPayload(){
  const wo = live ? programOf(live.w) : null;
  return {
    start: restEnd - restTotal*1000, end: restEnd,
    exercise: restLabel, workout: wo ? wo.name : "", sound: !!S.restBell,
    t: { rest:T("Dinlenme"), done:T("Mola bitti"), add:"+30 "+T("sn"), end:T("Bitir"),
         body: restLabel ? T("Sıradaki set: {n}",{n:restLabel}) : T("Sıradaki set seni bekliyor") }
  };
}
/* Native taraftan gelenler: kilit ekranindaki +30 sn / Bitir, uygulama geri acilinca esitleme */
let nativeDiag = null;

/* ---- HAZIRLIK — Apple Health (sadece iOS uygulamasi) ----
   Uyku, gece HRV'si, dinlenik nabiz ve solunum, son 21 gunun medyanina gore
   puanlanir. Apple'in kendi Readiness puani gelistiricilere acik degil;
   bu, ayni ham verilerden bizim hesabimiz. Pil: en fazla 30 dk'da bir sorgu. */
let healthData = null, healthAsked = 0;
function requestHealth(force){
  if(!NATIVE) return;
  if(!force && Date.now() - healthAsked < 5*60*1000) return;   // kucuk bir dosya okuma — yine de en fazla 5 dk'da bir
  healthAsked = Date.now();
  native("health", {force: !!force});
}
const clamp01 = v => Math.max(0, Math.min(1, v));
function readinessOf(m){
  if(!m || m.status !== "ok") return null;
  const t = m.today || {}, b = m.base || {};
  const parts = [];
  if(t.hrv != null && b.hrv)  parts.push({w:.4,  v: clamp01(.5 + (t.hrv/b.hrv - 1)*2.5)});   // ±%20 tam aralik
  if(t.rhr != null && b.rhr)  parts.push({w:.25, v: clamp01(.5 + (b.rhr - t.rhr)/8)});       // ±4 atim
  /* 12 saatten uzun uyku neredeyse her zaman "yatakta" + uyku kayitlarinin ust uste toplanmasi — kullanma */
  if(t.sleepH != null && t.sleepH <= 12) parts.push({w:.35, v: clamp01((t.sleepH - 5)/3)});   // 5 sa=0, 8 sa=1
  if(!parts.length) return null;
  const W = parts.reduce((a,p)=>a+p.w,0);
  let score = Math.round(10 * parts.reduce((a,p)=>a+p.w*p.v,0) / W);
  const respHigh = t.resp != null && b.resp && (t.resp - b.resp) > 1.5;
  if(respHigh) score = Math.min(score, 4);
  return {score, respHigh, partial: parts.length < 3};
}
/* Kestirmeler'in yazdigi saglik.txt — "anahtar=deger" satirlari, birim/virgul toleransli. */
function parseHealthText(txt){
  const out = {};
  const keyOf = k => {
    k = k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").trim();
    if(/^(sleep|uyku|uni)/.test(k)) return "sleepH";
    if(/^(hrv|nabiz degiskenligi)/.test(k)) return "hrv";
    if(/^(rhr|resting|dinlenik|nabiz|leposyke)/.test(k)) return "rhr";
    if(/^(resp|solunum|breath|hengitys)/.test(k)) return "resp";
    return null;
  };
  String(txt||"").split(/[;\r\n]+/).forEach(line => {
    const mm = line.match(/^\s*([^=:]+)[=:](.*)$/); if(!mm) return;
    const key = keyOf(mm[1]); if(!key) return;
    const nums = (mm[2].replace(/(\d),(\d)/g,"$1.$2").match(/-?\d+(?:\.\d+)?/g) || []).map(Number).filter(n => isFinite(n));
    if(!nums.length) return;
    let v = key === "sleepH" ? nums.reduce((a,b)=>a+b,0) : nums.reduce((a,b)=>a+b,0)/nums.length;
    if(key === "sleepH"){
      /* "7 hr 24 min", "7 h 24 m", "7 sa 24 dk", "7:24" gibi sure metinleri */
      const t = mm[2].toLowerCase().replace(/(\d),(\d)/g,"$1.$2");
      const hm = t.match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|sa|saat|t|tuntia)\b/);
      const mn = t.match(/(\d+(?:\.\d+)?)\s*(m|min|mins|minute|minutes|dk|dakika|min\.)\b/);
      const cl = t.match(/^\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*$/);
      if(cl) v = +cl[1] + (+cl[2])/60;
      else if(hm || mn) v = (hm ? +hm[1] : 0) + (mn ? +mn[1]/60 : 0);
      else if(v > 1440) v = v/3600; else if(v > 24) v = v/60;
    }
    if(v > 0) out[key] = Math.round(v*100)/100;
  });
  return out;
}
function dayISO(d){ const z = n => String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
/* Gunun ilk acilisinda bugun icin veri yoksa kestirmeyi bir kez kendimiz calistiralim. */
function maybeRunShortcut(f){
  const today = dayISO(new Date());
  const fresh = f && f.status === "ok" && dayISO(new Date(f.mtime||0)) === today;
  if(fresh || S.hsTried === today) return;
  S.hsTried = today; save();
  native("runShortcut");
}
window.runHealthShortcut = function(){ native("runShortcut"); };
function onHealthFile(f){
  maybeRunShortcut(f);
  if(!f || f.status !== "ok"){ onHealth({status: "missing"}); return; }
  const today = parseHealthText(f.text);
  const fresh = (Date.now() - (f.mtime||0)) < 20*3600*1000;
  const date = dayISO(new Date(f.mtime || Date.now()));
  const past = (S.readiness||[]).filter(r => r && r.date !== date && (r.src === "shortcut" || r.src === "health")).slice(-21);
  const med = k => { const v = past.map(r => r[k]).filter(x => typeof x === "number").sort((a,b)=>a-b);
    if(!v.length) return undefined; const h = v.length>>1; return v.length%2 ? v[h] : (v[h-1]+v[h])/2; };
  const base = {sleepH: med("sleepH"), hrv: med("hrv"), rhr: med("rhr"), resp: med("resp")};
  onHealth({status: Object.keys(today).length ? "ok" : "empty", date, today, base, days: past.length, stale: !fresh, src: "shortcut"});
}
function onHealth(m){
  healthData = m;
  const r = readinessOf(m);
  if(r && m.date){
    const t = m.today || {};
    const row = {date:m.date, score:r.score, sleepH:t.sleepH??null, hrv:t.hrv??null, rhr:t.rhr??null, resp:t.resp??null, src:m.src||"health"};
    if(!Array.isArray(S.readiness)) S.readiness = [];
    const i = S.readiness.findIndex(x => x.date === m.date);
    const same = i >= 0 && JSON.stringify(S.readiness[i]) === JSON.stringify(row);
    if(!same){ if(i >= 0) S.readiness[i] = row; else S.readiness.push(row); save(); }
  }
  if(view === "home") render();
}
function readyCardHtml(){
  if(!NATIVE) return "";
  const m = healthData;
  if(!m) return `<div class="readycard"><div class="grow"><div class="lbl">${T("Hazırlık")}</div><div class="msg">${T("Apple Health okunuyor…")}</div></div></div>`;
  if(m.status !== "ok"){
    return `<div class="readycard" onclick="runHealthShortcut()"><div class="grow"><div class="lbl">${T("Hazırlık")}</div>
      <div class="msg">${m.status === "missing" ? T("\"Antrenman Saglik\" kestirmesinden henüz veri gelmedi. Dokun: kestirmeyi çalıştır.") : T("Kestirmeden veri geldi ama içinde değer bulunamadı. Dokun: tekrar çalıştır.")}</div></div></div>`;
  }
  const r = readinessOf(m), t = m.today||{}, b = m.base||{};
  if(!r) return `<div class="readycard" onclick="requestHealth(true)"><div class="grow"><div class="lbl">${T("Hazırlık")}</div><div class="msg">${T("Bu gece için henüz veri yok.")}</div></div></div>`;
  const col = r.score >= 7 ? "var(--green)" : r.score >= 4 ? "var(--amber)" : "var(--red)";
  const advice = r.respHigh ? T("Solunum hızın normalden yüksek — hastalık başlangıcı olabilir, hafif tut.")
    : r.score >= 7 ? T("Toparlanmışsın — normal antrenman.")
    : r.score >= 4 ? T("Normal antrenman, ama RPE'ni dinle.")
    : T("Toparlanma düşük — ağırlık artışını zorlama.");
  const f1 = v => v == null ? "–" : (Math.round(v*10)/10).toLocaleString(LOCALE[LANG]);
  const f0 = v => v == null ? "–" : Math.round(v);
  const cmp = (v, base, higherBetter, fmt) => {

    let ar = "";
    if(base){ const d = v - base; const tol = Math.abs(base)*0.03;
      if(Math.abs(d) > tol){ const good = higherBetter ? d > 0 : d < 0; ar = ` <span style="color:${good?'var(--green)':'var(--red)'}">${d>0?'↑':'↓'}</span>`; } }
    return `<b>${fmt(v)}</b>${ar}${base?` <span style="color:var(--faint)">/ ${fmt(base)}</span>`:''}`;
  };
  return `<div class="readycard" onclick="runHealthShortcut()" style="align-items:flex-start">
    <div style="flex:none;width:52px;height:52px;border-radius:50%;border:3px solid ${col};display:grid;place-items:center;font-family:var(--fn);font-size:20px;font-weight:800">${r.score}</div>
    <div class="grow">
      <div class="lbl">${T("Bugünkü Hazırlık")}${r.partial?` <span style="color:var(--faint)">· ${T("eksik veri")}</span>`:''}</div>
      <div class="msg" style="color:var(--text)">${advice}</div>
      <div class="msg" style="display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-family:var(--fn);font-size:11.5px">
        <span>${T("Uyku")}</span><span>${cmp(t.sleepH, b.sleepH, true, v=>f1(v)+" "+T("sa"))}</span>
        <span>HRV</span><span>${cmp(t.hrv, b.hrv, true, v=>f0(v)+" ms")}</span>
        <span>${T("Dinlenik nabız")}</span><span>${cmp(t.rhr, b.rhr, false, f0)}</span>
        <span>${T("Solunum")}</span><span>${cmp(t.resp, b.resp, false, f1)}</span>
      </div>
      <div class="msg" style="font-size:10.5px;color:var(--faint);margin-top:4px">${m.stale?`<span style="color:var(--amber)">${T("Eski veri — kestirme bugün çalışmamış")}</span> · `:''}${m.days ? T("Apple Watch verilerinden hesaplandı · / = son {n} gün ortancası",{n:m.days}) : T("Karşılaştırma için birkaç günlük veri birikmesi gerekiyor.")}</div>
    </div></div>`;
}
/* "Antrenman acildiginda" otomasyonu kestirmeyi uygulamayla AYNI ANDA calistirir;
   dosya birkac saniye sonra yazilir. O yuzden acilistan sonra iki kez daha bak. */
function healthAfterOpen(){ requestHealth(false); setTimeout(()=>requestHealth(true), 5000); setTimeout(()=>requestHealth(true), 15000); }
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) healthAfterOpen(); });
window.runNativeDiag = function(){ nativeDiag = [["…","kontrol ediliyor"]]; render(); native("diag"); };

    if(m && m.type === "healthFile"){ onHealthFile(m); return; }
    if(m && m.type === "diag"){ nativeDiag = (m.rows || []).concat([["JS hataları", jsErrors.length ? jsErrors.slice(-5).join(" | ") : "yok"]]); if(view === "settings") render(); return; }

function startRest(sec, label){
  stopRestCore(true);
  restEnd = Date.now() + sec*1000;
  restTotal = sec; restLabel = label || "";
  if(NATIVE) native("restStart", restPayload());
  else if(S.restBell){ keepAliveOn(); nowPlayingOn(); }
  runRestLoop();
}
/* Pil: iOS uygulamasinda arka plandayken sayfa sayaci calismasin —
   kilit ekrani/ada sayacini sistem kendisi sayiyor, bitis bildirimi native. */
document.addEventListener("visibilitychange", ()=>{
  if(!NATIVE) return;
  if(document.hidden){ if(restTimer){ clearInterval(restTimer); restTimer = null; } }
  else if(restEnd){ if(restLeftSec() > 0) runRestLoop(); else endRestLocal(false); }
});
function runRestLoop(){
  if(restTimer) clearInterval(restTimer);
  restTimer = setInterval(()=>{
    if(restLeftSec() <= 0){ endRestLocal(true); return; }
    renderRest();
  }, 250);
  renderRest();
}
/* natural = sure doldu (zil/bildirim), false = iptal */
function endRestLocal(natural){
  if(restTimer){ clearInterval(restTimer); restTimer=null; }
  restEnd = 0; restTotal = 0;
  if(NATIVE){ if(natural) native("restDone"); }
  else { keepAliveOff(); nowPlayingOff(); if(natural) buzz(); }
  renderRest();
}
/* silent = native'e haber verme (yeni mola hemen baslayacak ya da haber zaten native'den geldi) */
function stopRestCore(silent){
  const was = !!restEnd;
  endRestLocal(false);
  if(NATIVE && was && !silent) native("restStop");
}
function stopRest(){ stopRestCore(false); }
window.stopRest = stopRest;
window.addRest = function(s){
  if(!restEnd) return;
  restEnd += s*1000; restTotal += s; npLast = -1;
  native("restAdd", {end: restEnd});
  renderRest();
};
function renderRest(){
  const left = restLeftSec();
  document.body.classList.toggle("resting", !!(restTimer && left>0));
  if(!restTimer || left<=0){ $rest.innerHTML=""; return; }
  if(!NATIVE) nowPlayingTick(left);
  $rest.innerHTML = `<div class="restpill">
    <div class="dot"></div>
    <div class="t">${mmss(left)}</div>

    <button onclick="stopRest()">×</button>
  </div>`;
}
/* Uygulamaya geri donuldugu an dogru rakami goster (250ms bekleme). */

/* ---------- zil ----------
   iPhone'da sayfa arka planda donar; sadece ses calarken uyanik kalir.
   Bu yuzden zil ACIKSA mola boyunca cok kisik bir dongu calinir.
   Kapaliyken hicbir ses acilmaz, muzigin/podcast'in bolunmez. */
let kaEl = null, kaUrl = null, actx = null;
function silentUrl(){
  if(kaUrl) return kaUrl;
  /* 30 sn: iOS cok kisa (yarim saniyelik) sesleri "gercek medya" saymiyor ve
     kilit ekranina / Dynamic Island'a koymuyor. 8 kHz 8-bit mono = ~240 KB, sadece bellekte. */
  const sr = 8000, n = sr*30, b = new Uint8Array(44+n);
  const dv = new DataView(b.buffer);
  const put = (o,s)=>{ for(let i=0;i<s.length;i++) b[o+i]=s.charCodeAt(i); };
  put(0,"RIFF"); dv.setUint32(4, 36+n, true); put(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr,true);
  dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  put(36,"data"); dv.setUint32(40,n,true);
  for(let i=0;i<n;i++) b[44+i] = 128;
  kaUrl = URL.createObjectURL(new Blob([b], {type:"audio/wav"}));
  return kaUrl;
}
function keepAliveOn(){
  try{
    if(!kaEl){ kaEl = new Audio(silentUrl()); kaEl.loop = true; kaEl.volume = 0.02; kaEl.preload = "auto"; kaEl.setAttribute("playsinline",""); }
    kaEl.play().catch(()=>{});
    /* Ses motorunu dokunma anında ac — zil vakti gelince hazir olsun. */
    const C = window.AudioContext || window.webkitAudioContext;
    if(C && !actx) actx = new C();
    if(actx && actx.state === "suspended") actx.resume().catch(()=>{});
  }catch(e){}
}
function keepAliveOff(){ try{ if(kaEl){ kaEl.pause(); kaEl.currentTime = 0; } }catch(e){} }

/* ---------- Dynamic Island / kilit ekrani (DENEME) ----------
   PWA'lar Live Activity kullanamiyor. Ama mola sirasinda zaten calan sessiz
   ses, Media Session bilgisiyle "su an calan" olarak gosterilebiliyor:
   baslikta kalan sure, altta hareket adi, ilerleme cubugu. Sadece zil
   ACIKKEN calisir — zil kapaliyken ses calmiyoruz (muzigini bolmemek icin). */
let npLast = -1, npArt = null;
function npArtwork(){
  if(npArt) return npArt;
  try{
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const g = c.getContext("2d");
    g.fillStyle = "#0A0B0D"; g.fillRect(0,0,512,512);
    g.lineCap = "round";
    g.strokeStyle = "#33363C"; g.lineWidth = 34;
    g.beginPath(); g.arc(256,256,170,0,Math.PI*2); g.stroke();
    g.strokeStyle = "#F5A623";
    g.beginPath(); g.arc(256,256,170,-Math.PI/2,Math.PI*1.1); g.stroke();
    g.strokeStyle = "#F7F7F8"; g.lineWidth = 26;
    g.beginPath(); g.moveTo(256,256); g.lineTo(256,160); g.moveTo(256,256); g.lineTo(320,296); g.stroke();
    npArt = c.toDataURL("image/png");
  }catch(e){ npArt = ""; }
  return npArt;
}
function nowPlayingOn(){
  if(!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
  try{
    const ms = navigator.mediaSession;
    ms.setActionHandler("pause", () => stopRest());           // durdur = molayi bitir
    ms.setActionHandler("play", () => { if(kaEl) kaEl.play().catch(()=>{}); });
    try{ ms.setActionHandler("seekforward", () => addRest(30)); }catch(e){}
    try{ ms.setActionHandler("seekbackward", null); }catch(e){}
    try{ ms.setActionHandler("seekto", null); }catch(e){}
    npLast = -1;
    nowPlayingTick(restLeftSec());
  }catch(e){}
}
function nowPlayingTick(left){
  if(!S.restBell || !("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
  if(left === npLast) return;
  npLast = left;
  try{
    const art = npArtwork();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: T("Dinlenme") + " · " + mmss(left),
      artist: restLabel || T("Antrenman"),
      album: "antreman",
      artwork: art ? [{src: art, sizes: "512x512", type: "image/png"}] : []
    });
    navigator.mediaSession.playbackState = "playing";
    if(navigator.mediaSession.setPositionState && restTotal > 0){
      const dur = Math.max(restTotal, 1);
      navigator.mediaSession.setPositionState({duration: dur, playbackRate: 1,
        position: Math.min(dur, Math.max(0, dur - left))});
    }
  }catch(e){}
}
function nowPlayingOff(){
  npLast = -1;
  if(!("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata = null;
    navigator.mediaSession.playbackState = "none";
    if(navigator.mediaSession.setPositionState) navigator.mediaSession.setPositionState();
  }catch(e){}
}

function buzz(){
  if(!S.restBell) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    if(!actx) actx = new C();
    if(actx.state === "suspended") actx.resume().catch(()=>{});
    const beep = (at, hz)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination); o.frequency.value = hz; o.type = "sine";
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.3, at+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at+0.45);
      o.start(at); o.stop(at+0.5);
    };
    const t = actx.currentTime;
    beep(t, 880); beep(t+0.35, 1170);
  }catch(e){}
}

/* =========================================================
   TEK SEFERLİK GEÇİŞ — orantılı ilerleme kuralı
   Sadece en net asiri durumlari (hedefin 3+ kati, "recalibrate" katmani)
   simdi duzeltir — leg press gibi. Sinirdaki "2 kat" durumlarina (chest
   press, shoulder press gibi) dokunmuyor, onlar dogal olarak bir sonraki
   antrenmanda kendi kuralina gore ilerler. Agirlik hicbir zaman azaltilmaz.
   ========================================================= */
function migrateTieredRecalibration(){
  if(S.migratedTieredProgression) return;
  const ids = new Set();
  S.sessions.forEach(s => Object.keys(s.entries).forEach(id => ids.add(id)));
  ids.forEach(id => {
    const ex = findExAny(id);
    if(!ex || ex.type === "bw") return;
    for(let i=S.sessions.length-1; i>=0; i--){
      const e = S.sessions[i].entries[id];
      if(e && e.kg != null && e.reps){
        const d = progressDecision(ex, e.reps, e.rpe, e.kg);
        if(d.tier === "recalibrate" && S.weights[id] != null && d.weight > S.weights[id]){
          S.weights[id] = d.weight;
        }
        break;
      }
    }
  });
  S.migratedTieredProgression = true;
  save();
}

/* =========================================================
   TEK SEFERLİK GEÇİŞ — Dumbbell Bench Press -> Üst Göğüs Makinesi
   ========================================================= */
function migrateB2u(){
  if(!S.setup) return;               // henuz kurulum yapilmamis kullanicida gerek yok
  if(S.weights.b2u != null) return;  // zaten kurulmus
  /* Chest press'in kendi yukleme moduna gore GERCEK tek taraf yukunu bul —
     ham S.weights.a1 sayisini degil (o "toplam" olabilir), her zaman
     perSideKg() ile ayni birimden kiyasla. */
  const chestPerSide = S.weights.a1 != null ? perSideKg("a1", S.weights.a1) : null;
  const est = chestPerSide != null ? Math.max(mround(chestPerSide*0.65, 2.5), 2.5) : 12.5;
  S.weights.b2u = est*2;               // kayit TOPLAM kg olarak tutulur
  if(!S.loadTypes) S.loadTypes = {};
  if(S.loadTypes.b2u == null) S.loadTypes.b2u = "total";
  save();
}

/* ESKI KAYIT DUZELTMESI — "side" modu kaldirildi.
   Eskiden bu moddaki hareketlerde kayitli sayi KOL BASINA idi; artik
   her hareket TOPLAM kg saklaniyor. Bu yuzden eski degerleri ikiye
   katliyoruz ki fiziksel yuk ayni kalsin, ama gecmis/ilerleme
   ekranlarinda diger hareketlerle ayni birimden gorunsun. */
function migrateSideToTotal(){
  if(S.migratedSideToTotal) return;
  const ids = Object.keys(S.loadTypes||{}).filter(k => S.loadTypes[k] === "side");
  ids.forEach(id => {
    if(S.weights[id] != null) S.weights[id] = Math.round(S.weights[id]*2*100)/100;
    (S.sessions||[]).forEach(sess => {
      const e = sess.entries && sess.entries[id];
      if(e && e.kg != null) e.kg = Math.round(e.kg*2*100)/100;
    });
    if(S.live && S.live.entries && S.live.entries[id] && S.live.entries[id].kg != null){
      S.live.entries[id].kg = Math.round(S.live.entries[id].kg*2*100)/100;
    }
    /* Artis da kol basinaydi — toplamda iki katina denk gelir */
    if(S.incs && S.incs[id] != null) S.incs[id] = Math.round(S.incs[id]*2*100)/100;
    S.loadTypes[id] = "total";
  });
  S.migratedSideToTotal = true;
}

/* =========================================================
   TEK SEFERLİK GEÇİŞ — kaba kademe + zayıf set kuralı
   1) b5 artik dumbbell degil, pinli makine. Eskiden dumbbell BASINA kg
      giriliyor, pime iki kati takiliyordu — kayitlari ikiye katlayip
      makinede gercekten secilebilen kademeye yuvarliyoruz.
   2) Kaba kademeli hareketlerin guncel agirligi kademe izgarasina otursun
      (2.5'lik ek agirlik artik salonda yasak).
   3) Zayif set kurali yeni — son antrenmani bu kurala gore yeniden
      degerlendirip yanlis verilmis artislari geri aliyoruz.
   Agirlik hicbir yerde kendiliginden AZALTILMIYOR; sadece hak edilmemis
   artis geri alinir.
   ========================================================= */
function migrateCoarseSteps(){
  if(S.migratedCoarseSteps) return;
  if(!S.setup){ S.migratedCoarseSteps = true; return; }

  /* 1) b5 — dumbbell basina kayit -> makinedeki toplam pim agirligi */
  const b5 = findExAny("b5");
  if(b5){
    const st = stepOf(b5);
    const dbl = v => snapStep(Math.round(v*2*100)/100, st);
    (S.sessions||[]).forEach(sess => {
      const e = sess.entries && sess.entries.b5;
      if(e && e.kg != null) e.kg = dbl(e.kg);
    });
    if(S.live && S.live.entries && S.live.entries.b5 && S.live.entries.b5.kg != null){
      S.live.entries.b5.kg = dbl(S.live.entries.b5.kg);
    }
    if(S.weights.b5 != null) S.weights.b5 = dbl(S.weights.b5);
    if(S.incs) delete S.incs.b5;   // eski 2 kg'lik dumbbell artisi artik gecersiz
  }

  /* 2) Kaba kademeli hareketlerin guncel agirligini izgaraya oturt */
  allEx().forEach(ex => {
    if(S.weights[ex.id] == null) return;
    if(!isCoarse(ex)) return;
    S.weights[ex.id] = snapStep(S.weights[ex.id], stepOf(ex));
  });

  /* 3) Zayif set kurali — son antrenmani yeniden degerlendir */
  allEx().forEach(ex => {
    if(ex.type !== "sec" && ex.type !== "sec4") return;
    for(let i=S.sessions.length-1; i>=0; i--){
      const e = S.sessions[i].entries[ex.id];
      if(e && e.kg != null && e.reps){
        const d = progressDecision(ex, e.reps, e.rpe, e.kg);
        if(d.tier === "hold_weak_sets" && S.weights[ex.id] != null && S.weights[ex.id] > d.weight){
          S.weights[ex.id] = d.weight;
        }
        break;
      }
    }
  });

  S.migratedCoarseSteps = true;
}

/* Yarim kalmis antrenmani geri yukle — uygulama kazara kapandiysa
   girdigin setler kaybolmasin. Cok eski (24 saatten fazla) kayitlari
   sormadan atmiyoruz; kullaniciya birakiyoruz. */
function restoreLiveSession(){
  if(!S.live || !S.live.w || !PROGRAM[S.live.w]) { S.live = null; liveRestored = true; return; }
  live = S.live;
  liveRestored = true;
  /* Program degismisse (yeni hareket eklendi vb.) eksik girisleri tamamla.
     Bu noktada seedMissingWeights() henuz calismadi (migration'lardan once
     geliyoruz) — yeni hareketin agirligi bos kalmasin diye ayni formulle
     varsayilani burada hesapla. */
  PROGRAM[live.w].ex.forEach(ex => {
    if(!live.entries[ex.id]){
      const seedKg = ex.test ? Math.max(mround(epley(ex.test[0], ex.test[1]) * ex.pct, 2.5), 2.5) : null;
      live.entries[ex.id] = { kg: ex.type==="bw" ? null : (S.weights[ex.id] != null ? S.weights[ex.id] : seedKg),
                              reps: new Array(ex.sets).fill(null),
                              rpe:  new Array(ex.sets).fill(null) };
    }
  });
  view = "session";
  const ago = live.startTime ? Math.round((Date.now()-live.startTime)/60000) : null;
  const agoTxt = ago == null ? "" : ago < 60 ? " " + T("({n} dk önce başladı)",{n:ago}) :
                 " " + T("({n} saat önce başladı)",{n:Math.round(ago/60)});
  setTimeout(()=>{
    const cont = confirm(T("Yarım kalmış bir {name} antrenmanın var{ago}.\n\nKaldığın yerden devam etmek ister misin?\n\nTamam = devam et\nİptal = bu antrenmanı sil",{name:PROGRAM[live.w].name,ago:agoTxt}));
    if(!cont){ live = null; view = "home"; save(); }
    render();
  }, 100);
}

/* Tum gecis islemleri — hem acilista hem JSON ice aktarmadan sonra
   calismali, yoksa eski bir yedek yuklendiginde yeni hareketlerin
   agirligi kurulmadan kalir (ekranda "—" gorunur). */
/* Guvenlik agi: aktif programdaki bir hareketin agirligi hic kurulmamissa
   (eski yedek, sonradan eklenen hareket) varsayilan test degerinden hesapla.
   Boylece hicbir hareket ekranda "—" olarak kalmaz. */
function seedMissingWeights(){
  if(!S.setup) return;
  let changed = false;
  allEx().forEach(ex => {
    if(ex.type === "bw") return;
    if(S.weights[ex.id] != null) return;
    const t = ex.test;
    S.weights[ex.id] = Math.max(mround(epley(t[0], t[1]) * ex.pct, 2.5), 2.5);
    changed = true;
  });
  if(changed) save();
}

/* TEK SEFERLIK DUZELTME — 2026-10-13 Seated Cable Row.
   Makinede 46 kg takiliydi ama uygulamada elle girilemedigi icin 47.5
   kaydedilmisti (ve sonraki agirlik bu yanlis kilodan hesaplanmisti).
   Kaydi 46'ya cevirip sonraki agirligi gercek kilodan yeniden hesapla. */
function migratePinFix1(){
  if(S.migratedPinFix1) return;
  if(!S.setup){ S.migratedPinFix1 = true; return; }
  const sess = (S.sessions||[]).find(s => s.date === "2026-10-13" && s.w === "B" && s.entries && s.entries.b3 && s.entries.b3.kg === 47.5);
  if(sess){
    const e = sess.entries.b3;
    e.kg = 46;
    const ex = findExAny("b3");
    if(ex){
      const d = progressDecision(ex, e.reps, e.rpe, 46);
      /* Sonraki antrenman bu seanstan sonra baska bir B seansi yapilmadiysa guncelle */
      const laterB = S.sessions.some(s => s !== sess && s.date > sess.date && s.entries && s.entries.b3);
      if(!laterB && d.weight != null) S.weights.b3 = d.weight;
    }
  }
  S.migratedPinFix1 = true;
}

function runMigrations(){
  migrateSideToTotal();   // once birim duzeltmesi, sonra digerleri
  migrateB2u();
  migrateTieredRecalibration();
  migrateCoarseSteps();
  migratePinFix1();
  seedMissingWeights();
  save();
}

"Mola zili: süre bitince ses çalar. Açıkken mola boyunca çok kısık bir ses çalar — bu olmadan iPhone sayfayı dondurur ve zil hiç çalmaz. Podcast veya müziğini duraklatabilir, telefon sessiz moddayken de duyulmaz. Sayaç, zil kapalıyken de doğru çalışır.": "Tauon kello: ääni soi, kun aika loppuu. Päällä ollessaan hyvin hiljainen ääni soi tauon ajan — ilman sitä iPhone jäädyttää sivun eikä kello soi lainkaan. Se voi keskeyttää podcastin tai musiikin, eikä sitä kuule puhelimen ollessa äänettömällä. Ajastin toimii oikein myös kellon ollessa pois päältä.",
"Pinli makineler (Seated Cable Row, Reverse Pec Deck, Ab Crunch, Biceps, Triceps…): her satırın altındaki \"Pim listesi\" bağlantısından makinedeki gerçek kiloları tek tek ekle (ör. 34, 40, 46, 52). Liste girilince −/+ ve otomatik artış/azalış sadece bu değerler arasında gezer. Antrenman sırasında kiloya dokunarak da istediğin değeri elle yazabilirsin.": "Pinnikuormitteiset laitteet (Seated Cable Row, Reverse Pec Deck, Ab Crunch, Biceps, Triceps…): lisää laitteen todelliset painot yksitellen kunkin rivin alla olevasta \"Pinnilista\"-linkistä (esim. 34, 40, 46, 52). Kun lista on asetettu, −/+ ja automaattiset nostot/laskut liikkuvat vain näiden arvojen välillä. Treenin aikana voit myös napauttaa painoa ja kirjoittaa minkä tahansa arvon käsin.",
"Ağırlık: bir sonraki antrenmanda kullanacağın kilo. Artış: hedefi tutturduğunda eklenecek kilo. Kademe alanı sadece pinli makinelerde (Biceps, Triceps) görünür — o makinede gerçekten seçilebilen en küçük adım. Kademe, ağırlığın %10'undan büyükse hareket kaba kademe moduna geçer: ağırlık her antrenman artmaz, önce tekrarlar tavana çıkar, sonra tek seferde bir kademe atlanır. Plakalı makineler bu moda hiç girmez.": "Paino: seuraavassa treenissä käyttämäsi paino. Nousu: tavoitteen saavuttamisen jälkeen lisättävä paino. Askel-kenttä näkyy vain pinnikuormitteisilla laitteilla (Biceps, Triceps) — pienin askel, jonka laitteessa voi oikeasti valita. Jos askel on yli 10 % painosta, liike siirtyy iso askel -tilaan: paino ei nouse joka treenillä, vaan toistot nousevat ensin huippuun ja sitten paino hyppää yhden askeleen kerralla. Levypainolaitteet eivät koskaan käytä tätä tilaa.",
