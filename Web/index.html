<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="theme-color" content="#0A0B0D">
<title>Antrenman</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230A0B0D'/%3E%3Crect x='30' y='78' width='120' height='24' rx='6' fill='%23FFB224'/%3E%3Crect x='20' y='62' width='22' height='56' rx='8' fill='%23FFB224'/%3E%3Crect x='138' y='62' width='22' height='56' rx='8' fill='%23FFB224'/%3E%3C/svg%3E">

<style>
:root{
  --bg:#060708;
  --card:#131417;
  --card-2:#1A1C20;
  --cell:#0E0F11;
  --line:#232529;
  --line-hi:#33363C;
  --plate-old:#4A4E56;
  --plate-ghost:#6B7079;
  --text:#F7F7F8;
  --muted:#8B929C;
  --faint:#565C66;
  --amber:#F5A623;
  --amber-hi:#FFBE45;
  --amber-deep:#D98C0A;
  --amber-glow:rgba(245,166,35,.15);
  --green:#4ADE80;
  --red:#F87171;
  --r:16px;
  --r-lg:20px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --fn:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:calc(68px + var(--safe-b));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:var(--f);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-t);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,select{font-family:inherit}
.hide{display:none !important}

#app{max-width:640px;margin:0 auto;padding:0 18px calc(var(--nav-h) + 20px)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 6px;padding-top:calc(var(--safe-t) + 10px)}
.top .back{width:40px;height:40px;display:grid;place-items:center;font-size:20px;color:var(--text)}
.top .ttl{font-size:16px;font-weight:700;letter-spacing:-.01em}
.top .r{min-width:40px;text-align:right}
.top .r .save{color:var(--amber);font-size:14px;font-weight:700}

h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px;line-height:1.1}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px;line-height:1.45}

/* ---------- home ---------- */
.hero{padding:22px 2px 4px}
.hello{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.name{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin-top:2px}

.readycard{background:rgba(19,20,23,.85);border:1px solid var(--line);border-radius:18px;
  padding:12px 14px;margin:18px 0 20px;display:flex;align-items:center;gap:12px;cursor:pointer}
.readycard:active{background:var(--card-2)}
.readycard .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.readycard .lbl b{color:var(--text);font-weight:700}
.readycard .msg{font-size:12.5px;color:var(--muted);margin-top:2px}
.readycard .grow{flex:1;min-width:0}
.readydial{width:48px;height:48px;position:relative;flex:none}
.readydial .n{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--fn);font-size:15px;font-weight:700;color:var(--amber)}
.readydial svg{transform:rotate(-90deg)}

.workoutcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 20px 20px;margin-bottom:26px}
.workoutcard .eyebrow{margin-bottom:8px}
.workoutcard .wname{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-bottom:20px}
.wstats{display:flex;align-items:center;margin-bottom:20px}
.wstat{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.wstat + .wstat{border-left:1px solid var(--line)}
.wstat svg{width:18px;height:18px;color:var(--muted)}
.wstat .v{font-size:15px;font-weight:700;letter-spacing:-.01em}
.wstat .v small{color:var(--muted);font-weight:600;font-size:12px;margin-left:2px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:56px;padding:16px;border-radius:14px;
  background:linear-gradient(180deg,var(--amber-hi),var(--amber));
  color:#17130A;font-size:15.5px;font-weight:800;letter-spacing:.06em;
  box-shadow:0 4px 18px rgba(245,166,35,.25)}
.btn:active{transform:scale(.98);filter:brightness(.94)}
.btn .chev{font-size:18px;font-weight:800;margin-top:-1px}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none;letter-spacing:.04em}
.btn.sm{min-height:44px;padding:12px;font-size:13.5px;border-radius:12px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line);box-shadow:none}
.btn.outline{background:transparent;color:var(--amber);border:1.5px solid var(--amber);box-shadow:none}

.secrow{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.secrow .l{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.secrow .r{font-size:11.5px;color:var(--faint);font-weight:600}

.qsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.qs{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 13px 12px;
  display:flex;flex-direction:column;min-height:108px}
.qs .k{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}
.qs .v{font-family:var(--fn);font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.qs .v small{font-family:var(--f);font-size:10.5px;color:var(--muted);font-weight:600}
.qs .s{font-size:10.5px;color:var(--faint);margin-top:3px;font-weight:600}
.qs .chg{font-family:var(--fn);font-size:11px;font-weight:700;margin-top:3px}
.qs .chg.up{color:var(--green)} .qs .chg.dn{color:var(--red)}
.qs .viz{margin-top:auto;padding-top:8px;height:30px;display:flex;align-items:flex-end}

.lastcard{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;cursor:pointer}
.lastcard:active{background:var(--card-2)}
.lastcard .toprow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.lastcard .k{font-size:10px;color:var(--faint);letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.lastcard .ago{font-size:11px;color:var(--muted);font-weight:600}
.lastcard .n{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.lastcard .botrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px}
.lastcard .m{font-size:12px;color:var(--muted);font-family:var(--fn)}
.lastcard .t{color:var(--amber);font-family:var(--fn);font-size:13px;font-weight:700}

/* ---------- bottom nav (5 tabs) ---------- */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:80;
  background:rgba(6,7,8,.92);backdrop-filter:blur(24px);
  border-top:1px solid var(--line);
  padding:10px 2px calc(10px + var(--safe-b));
  display:flex;max-width:640px;margin:0 auto}
.navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:4px 2px;color:var(--faint);font-size:9.5px;font-weight:700;letter-spacing:.01em}
.navbar button svg{width:22px;height:22px}
.navbar button.on{color:var(--amber)}
.navbar button:active{transform:scale(.92)}

/* ---------- session ---------- */
.prog-hd{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 10px}
.prog-hd .l{font-size:10.5px;color:var(--muted);letter-spacing:.16em;font-weight:800;text-transform:uppercase}
.prog-hd .r{font-family:var(--fn);font-size:13px;font-weight:700;color:var(--amber)}
.prog-hd .r .p{color:var(--muted);font-size:11px;margin-left:8px}
.segbar{display:flex;gap:5px;margin-bottom:22px}
.segbar > div{flex:1;height:7px;border-radius:99px;background:var(--card-2)}
.segbar > div.f{background:linear-gradient(90deg,var(--amber-deep),var(--amber))}

.exlist{display:flex;flex-direction:column;gap:10px}
.exrow{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;display:flex;align-items:center;gap:13px;cursor:pointer}
.exrow:active{background:var(--card-2)}
.exrow.active{border-color:var(--amber);background:rgba(245,166,35,.05)}
.exrow.done .ex-num{color:var(--green)}
.ex-num{width:18px;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--faint);text-align:center;flex:none}
.ex-icon{width:48px;height:48px;border-radius:12px;background:var(--cell);border:1px solid var(--line);
  display:grid;place-items:center;flex:none;overflow:hidden;padding:4px}
.ex-icon svg{width:100%;height:100%}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ex-scheme{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:var(--fn);letter-spacing:.01em}
.ex-scheme .sep{margin:0 5px;color:var(--faint)}
.ex-side{text-align:right;flex:none;display:flex;align-items:center;gap:10px}
.ex-side .ormwrap .orml{font-size:9px;color:var(--faint);letter-spacing:.1em;font-weight:800;text-transform:uppercase}
.ex-side .ormwrap .ormv{font-family:var(--fn);font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap}
.ex-side .chev{color:var(--faint);font-size:15px}

/* ---------- exercise detail ---------- */
.dethead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.dethead .pills{display:flex;gap:8px;flex-wrap:wrap;padding-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:8px 13px;font-size:12px;font-weight:700;color:var(--muted);
  font-family:var(--fn)}
.pill .hot{color:var(--amber)}
.dethead .art{width:104px;height:88px;flex:none;background:var(--card);border:1px solid var(--line);
  border-radius:14px;display:grid;place-items:center;padding:4px;overflow:hidden}
.dethead .art svg{width:100%;height:100%}

.tbl-label{font-size:10px;color:var(--faint);letter-spacing:.16em;font-weight:800;
  text-transform:uppercase;margin:18px 2px 8px}
.settbl{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.settbl-hd{display:flex;align-items:center;padding:10px 14px 8px;font-size:9px;color:var(--faint);
  letter-spacing:.14em;font-weight:800;text-transform:uppercase;border-bottom:1px solid var(--line)}
.settbl-hd .c1{width:30px}
.settbl-hd .c2{flex:1}
.settbl-hd .c3{width:64px;text-align:center}
.settbl-hd .c4{width:44px;text-align:center}
.settbl-hd .c5{width:34px}
.setrow{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow.active{box-shadow:inset 0 0 0 1.5px var(--amber);border-radius:2px;background:rgba(245,166,35,.04)}
.setrow .c1{width:30px;font-family:var(--fn);font-size:13px;font-weight:700;color:var(--muted)}
.setrow .c2{flex:1;display:flex;align-items:baseline;gap:7px}
.setrow .kgv{font-family:var(--fn);font-size:15.5px;font-weight:700}
.setrow .kgu{font-size:11px;color:var(--muted);font-weight:600}
.setrow .x{font-size:11px;color:var(--faint);font-family:var(--fn)}
.setrow .c3{width:64px;display:flex;justify-content:center}
.setrow .repcell{min-width:44px;text-align:center;background:var(--cell);border:1px solid var(--line);
  border-radius:9px;padding:6px 8px;font-family:var(--fn);font-size:15px;font-weight:700}
.setrow.empty .repcell{color:var(--faint)}
.setrow .c4{width:44px;text-align:center;font-family:var(--fn);font-size:14px;font-weight:700;color:var(--amber)}
.setrow.empty .c4{color:var(--faint)}
.setrow .c5{width:34px;display:flex;justify-content:flex-end}
.setrow .tick{width:23px;height:23px;border-radius:50%;border:1.5px solid var(--line-hi);
  display:grid;place-items:center;color:transparent}
.setrow.filled .tick{border-color:var(--amber);color:var(--amber);background:rgba(245,166,35,.08)}
.setrow .tick svg{width:12px;height:12px}

.stepper{display:flex;align-items:stretch;gap:10px;margin:16px 0 14px}
.stepper button{width:76px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  font-size:26px;font-weight:600;color:var(--text)}
.stepper button:active{background:var(--amber);color:#17130A;border-color:var(--amber)}
.stepper .val{flex:1;display:flex;align-items:baseline;justify-content:center;gap:5px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 0}
.stepper .val .n{font-family:var(--fn);font-size:34px;font-weight:700;color:var(--amber);letter-spacing:-.03em;line-height:1}
.stepper .val .u{font-size:13px;color:var(--muted);font-weight:700}

.numpad{margin-bottom:14px}
.numpad .head{font-size:10px;color:var(--faint);letter-spacing:.14em;font-weight:800;
  text-transform:uppercase;text-align:center;padding:2px 0 10px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pad button{height:54px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-family:var(--fn);font-size:19px;font-weight:700}
.pad button:active{background:var(--amber);color:#17130A;border-color:var(--amber)}
.pad button.wide{grid-column:span 2;font-family:var(--f);font-size:12.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.rpepanel{margin-bottom:14px}
.rpepanel .head{font-size:10px;color:var(--faint);letter-spacing:.14em;font-weight:800;
  text-transform:uppercase;text-align:center;padding:2px 0 10px}
.rpegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rpegrid button{padding:12px 4px 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.rpegrid button:active{background:var(--amber);border-color:var(--amber)}
.rpegrid button:active .n,.rpegrid button:active .l{color:#17130A}
.rpegrid .n{font-family:var(--fn);font-size:21px;font-weight:700}
.rpegrid .l{font-size:9px;color:var(--muted);font-weight:700;line-height:1.2;text-align:center}
.skipline{text-align:center;margin-top:10px}
.tinylink{font-size:12.5px;color:var(--muted);font-weight:600}

/* ---------- exercise animation frames ---------- */
.exanim{width:100%;height:100%;display:block}
.exanim .fr{opacity:0;animation:frcycle 1.8s steps(1,end) infinite}
@keyframes frcycle{0%,100%{opacity:0}0.01%{opacity:1}7.14%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .exanim .fr{animation:none}
  .exanim .fr:first-child{opacity:1}
}

/* ---------- rest pill ---------- */
.restpill{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + var(--safe-b));z-index:70;
  background:rgba(26,28,32,.96);border:1px solid var(--amber);border-radius:99px;
  padding:11px 18px 11px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.65), 0 0 24px var(--amber-glow);min-width:225px}
.restpill .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);
  animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.restpill .dot{animation:none}}
.restpill .t{font-family:var(--fn);font-size:22px;font-weight:700;color:var(--amber);flex:1;text-align:center;letter-spacing:-.02em}
.restpill button{color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 7px}

/* ---------- readiness ---------- */
.readyrow{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:15px 16px 18px;margin-bottom:12px}
.readyrow .head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.readyrow .iconwrap{width:36px;height:36px;border-radius:11px;background:var(--cell);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--amber);flex:none}
.readyrow .iconwrap svg{width:19px;height:19px}
.readyrow .lbl{font-size:15px;font-weight:700;flex:1}
.readyrow .lblval{font-family:var(--fn);font-size:15px;font-weight:700;color:var(--amber)}
.slider{position:relative;height:36px;user-select:none;touch-action:none;cursor:pointer}
.slider .track{position:absolute;left:8px;right:8px;top:9px;height:5px;background:var(--card-2);border-radius:99px}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--amber-deep),var(--amber));border-radius:99px}
.slider .thumb{position:absolute;top:11.5px;transform:translate(-50%,-50%);
  width:20px;height:20px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 0 4px rgba(245,166,35,.22), 0 2px 8px rgba(0,0,0,.5)}
.slider .marks{position:absolute;left:8px;right:8px;top:22px;display:flex;justify-content:space-between;
  font-family:var(--fn);font-size:9.5px;color:var(--faint);pointer-events:none;font-weight:600}

.scorecard{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:22px;text-align:center;margin-top:6px}
.scorecard .k{font-size:10px;color:var(--faint);letter-spacing:.18em;font-weight:800;text-transform:uppercase;margin-bottom:10px}
.scorecard .n{font-family:var(--fn);font-size:54px;font-weight:800;color:var(--amber);letter-spacing:-.04em;line-height:1}
.scorecard .m{font-size:13px;color:var(--muted);margin-top:10px}

/* ---------- done ---------- */
.donewrap{padding:34px 0 8px;text-align:center}
.donebadge{width:130px;height:130px;margin:0 auto 22px;position:relative;display:grid;place-items:center}
.donebadge svg.badge{width:100%;height:100%}
.donetitle{font-size:24px;font-weight:800;letter-spacing:-.02em}
.donesub{color:var(--muted);font-size:13.5px;margin-top:5px;margin-bottom:24px}
.donestats{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--card);margin-bottom:20px}
.donestat{flex:1;padding:14px 6px;text-align:center}
.donestat + .donestat{border-left:1px solid var(--line)}
.donestat .k{font-size:9px;color:var(--faint);letter-spacing:.12em;font-weight:800;text-transform:uppercase;margin-bottom:6px}
.donestat .v{font-family:var(--fn);font-size:17px;font-weight:700;color:var(--amber);letter-spacing:-.02em}
.donestat .v small{font-family:var(--f);font-size:10px;color:var(--muted);font-weight:600}

.perfblock{background:var(--card);border:1px solid var(--line);border-radius:15px;
  margin-bottom:18px;overflow:hidden}
.perfrow{padding:12px 15px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600}
.perfrow:last-child{border:none}
.perfrow .chg{font-family:var(--fn);font-size:12.5px;font-weight:700}
.perfrow .chg.up{color:var(--green)} .perfrow .chg.dn{color:var(--red)}
.perfrow .chg.same{color:var(--muted)}

/* ---------- progress ---------- */
.subtabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.subtabs button{flex:1;padding:11px 6px 12px;font-size:13px;font-weight:700;color:var(--muted);
  position:relative;white-space:nowrap}
.subtabs button.on{color:var(--amber)}
.subtabs button.on::after{content:"";position:absolute;left:15%;right:15%;bottom:-1px;height:2px;
  background:var(--amber);border-radius:2px}

.pickbox{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:4px 14px;margin-bottom:12px}
.pickbox select{width:100%;background:transparent;color:var(--text);border:none;font-size:15px;
  font-weight:700;padding:11px 0;outline:none;appearance:none;-webkit-appearance:none;

const L = (x1,y1,x2,y2,w,c) =>
  `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c||'var(--text)'}" stroke-width="${w||5}" stroke-linecap="round"/>`;
const C = (cx,cy,r,f) =>
  `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${f||'var(--text)'}"/>`;
const R = (x,y,w,h,f,rd) =>
  `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}" rx="${rd||2}" fill="${f}"/>`;
const P = (d,w,c,dash) =>
  `<path d="${d}" fill="none" stroke="${c||'var(--accent)'}" stroke-width="${w||2}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:""}/>`;

/* Bir hareketin animasyon SVG'sini üret (frame dizisi + CSS ile döngü) */
function exerciseSVG(exId, frames){
  const draw = DRAW[exId];
  if(!draw) return "";
  const N = frames || 14;
  let out = "";
  for(let i=0;i<N;i++){
    // ileri-geri: 0->1->0 (eksantrik dahil)
    const phase = i/(N-1);
    const t = phase<=0.5 ? phase*2 : (1-phase)*2;
    const eased = t*t*(3-2*t);   // smoothstep
    out += `<g class="fr" style="animation-delay:${(i*(1.8/N)).toFixed(3)}s">${draw(eased)}</g>`;
  }
  return `<svg class="exanim" viewBox="0 0 200 140" style="--frames:${N}">${out}</svg>`;
}

/* =========================================================
   HESAPLAMA
   ========================================================= */
const mround = (v, m) => Math.round(v/m)*m;
const epley  = (w, r) => mround(w*(1+r/30), 0.5);
function allEx(){
  const seen = new Set(), out = [];
  ORDER.forEach(k => PROGRAM[k].ex.forEach(e => {
    if(!seen.has(e.id)){ seen.add(e.id); out.push(e); }
  }));
  return out;
}
function findEx(id){ return allEx().find(e => e.id === id); }
function incOf(ex){ return S.incs[ex.id] != null ? S.incs[ex.id] : ex.inc; }

/* ---- MAKINE KADEMESI ------------------------------------------------
   Pinli makinelerde 1.25 / 2.5 gibi araliklar fiziksel olarak yok.
   stepOf() o makinede gercekten secilebilen en kucuk adimi verir;
   tanimlanmamissa normal artis miktarina duser (eski davranis).      */
/* ---- KILO LISTESI (pinli makine) -------------------------------------
   Bazi makinelerde (Cybex / True, lb tabanli) pim kademeleri duzgun bir
   aralik degil: 34, 40, 46, 52 gibi. Kullanici o makinenin gercek listesini
   Ayarlar'dan girer; artis/azalis ve -/+ dugmeleri sadece bu degerler
   arasinda gezer. Liste yoksa eski davranis aynen devam eder. */
const r2 = v => Math.round(v*100)/100;
function ladderOf(ex){
  const l = S.ladders && S.ladders[ex.id];
  return (Array.isArray(l) && l.length >= 2) ? l : null;
}
function nextRung(l, cur){ for(let i=0;i<l.length;i++) if(l[i] > cur + 0.001) return l[i]; return null; }
function prevRung(l, cur){ for(let i=l.length-1;i>=0;i--) if(l[i] < cur - 0.001) return l[i]; return null; }
function nearestRung(l, v){ return l.reduce((b,x) => Math.abs(x-v) < Math.abs(b-v) ? x : b, l[0]); }
/* Ham karardan cikan agirligi makinede gercekten takilabilir bir degere oturt.
   Artis: cur'un ustundeki en yakin pim. Azalis: hedefin altindaki en yakin pim. */
function snapToLadder(l, cur, w){
  if(w == null || cur == null || Math.abs(w-cur) < 0.001) return w;
  if(w > cur){
    const ups = l.filter(x => x > cur + 0.001);
    if(!ups.length) return cur;
    return nearestRung(ups, w);
  }
  const downs = l.filter(x => x <= w + 0.001);
  if(downs.length) return downs[downs.length-1];
  const below = l.filter(x => x < cur - 0.001);
  return below.length ? below[0] : cur;
}
/* Bu makinede bir sonraki pim ile mevcut arasindaki fark */
function stepOf(ex, cur){
  const l = ladderOf(ex);
  if(l){
    const c = cur != null ? cur : S.weights[ex.id];
    if(c != null){
      const n = nextRung(l, c), p = prevRung(l, c);
      if(n != null) return r2(n - c);
      if(p != null) return r2(c - p);
    }
    return r2(l[1]-l[0]);
  }
  if(S.steps && S.steps[ex.id] != null) return S.steps[ex.id];
  return ex.step != null ? ex.step : incOf(ex);
}
/* Kademe ACIKCA tanimlanmis mi? Sadece pinli makinelerde tanimliyoruz.
   Plakali makinelerde 1.25'lik plakayla istedigin araligi kurabilirsin,
   orada "kademe" diye bir kisit yok — kaba mod onlara ASLA uygulanmaz. */
function hasStep(ex){
  return !!ladderOf(ex) || (S.steps && S.steps[ex.id] != null) || ex.step != null;
}
const snapStep = (v, st) => st > 0 ? Math.max(st, Math.round(v/st)*st) : v;

/* Kademe, calisilan agirligin %10'undan buyukse tek bir pim atlamak
   cok buyuk bir sicrama demektir (25 kg'da 5 kg = %20). Bu hareketlerde
   agirlik yerine TEKRAR ilerler; aralik dolunca tam kademe atlanir.
   Sadece "acc" tipinde ve kademesi tanimli hareketlerde calisir. */
function isCoarse(ex, cur){
  if(ex.type !== "acc") return false;
  if(!hasStep(ex)) return false;
  const w = cur != null ? cur : S.weights[ex.id];
  if(w == null || w <= 0) return false;
  return stepOf(ex, w) / w > 0.10;
}

function seedWeights(tests){
  allEx().forEach(ex => {
    if(ex.type === "bw") return;
    const t = tests[ex.id] || ex.test;
    const orm = epley(t[0], t[1]);
    S.weights[ex.id] = Math.max(mround(orm*ex.pct, 2.5), 2.5);
  });
}

/* Tek karar merkezi — hem canli ilerleme (progress()) hem gecmisteki
   "neden degisti" notu (decisionNote()) buradan besleniyor, ikisi arasinda
   mantik sapmasi olmasin diye. */
/* ctx (istege bagli): {entry} — kararin ait oldugu gecmis kaydi (S.sessions
   icindeki nesne). entry:null = henuz kaydedilmemis, gecmisin sonuna gelecek
   seans (antrenman bitirilirken). Verilmezse "kolay seri" 0 sayilir. */
function progressDecision(ex, reps, rpeArr, cur, ctx){
  if(cur === undefined) cur = S.weights[ex.id];
  const streak = ctx && ctx.entry !== undefined ? easyStreakBefore(ex, ctx.entry) : 0;
  const d = progressDecisionRaw(ex, reps, rpeArr, cur, streak);
  /* Pinli makinede kilo listesi tanimliysa sonucu gercek pime oturt */
  const l = ladderOf(ex);
  if(l && d.weight != null && cur != null && d.tier !== "coarse_step_up"){
    const snapped = snapToLadder(l, cur, d.weight);
    if(Math.abs(snapped - d.weight) > 0.001){ d.rawWeight = d.weight; d.weight = snapped; }
  }
  return d;
}
/* ---- "KOLAY GELDI" --------------------------------------------------
   Bir agirlik uzun suredir RPE 6'da kaliyorsa 2.5 kg'lik adimlar gercek
   seviyeye haftalarca yetisemez. Kolay seans: tum setler hedefi tuttu ve
   ortalama RPE dusuk. Arka arkaya kolay seanslarda artis buyur:
   1. kolay seans +%10, 2. +%15, 3. ve sonrasi +%20 (her zaman en az 2 adim).
   Kapsam: sec, sec4, acc. main haric (AMRAP seti zaten bunu yapiyor);
   kaba kademeli pinli makineler haric (orada tekrar merdiveni var). */
const EASY = { secRpe: 6.5, accRpe: 7, pct: [0.10, 0.15, 0.20], bumpRpe: 6, bumpPct: 0.15, maxBumps: 2 };
function easyCriteria(ex, reps, rpeArr, cur){
  if(!(ex.type === "sec" || ex.type === "sec4" || ex.type === "acc")) return false;
  if(ex.type === "acc" && isCoarse(ex, cur)) return false;
  const rs = (reps || []).slice(0, ex.sets);
  if(rs.length < ex.sets || rs.some(r => r == null)) return false;
  const rv = (rpeArr || []).slice(0, ex.sets).filter(v => v != null);
  if(rv.length < 2) return false;                     // tek RPE'den karar verme
  const avg = rv.reduce((a,b)=>a+b,0) / rv.length;
  if(ex.type === "acc"){
    const minReps = ex.min != null ? ex.min : Math.ceil((ex.total||0) / ex.sets);
    const maxReps = ex.max != null ? ex.max : minReps;
    return rs.every(r => r >= Math.max(minReps, maxReps - 1)) && avg <= EASY.accRpe + 1e-9;
  }
  return rs.every(r => r >= ex.target) && avg <= EASY.secRpe + 1e-9;
}
/* entry'den ONCEKI, ayni harekete ait arka arkaya kolay seans sayisi.
   entry null / bulunamazsa: gecmisin sonundan geriye sayar. */
function easyStreakBefore(ex, entry){
  let idx = entry ? S.sessions.findIndex(s => s.entries && s.entries[ex.id] === entry) : -1;
  if(idx < 0) idx = S.sessions.length;
  let n = 0;
  for(let j = idx - 1; j >= 0 && n < 5; j--){
    const e = S.sessions[j].entries && S.sessions[j].entries[ex.id];
    if(!entryUsable(e)) continue;
    if(easyCriteria(ex, e.reps, e.rpe, e.kg)) n++; else break;
  }
  return n;
}
/* Makinede gercekten kurulabilen EN YAKIN deger (plaka ya da pim adimi).
   Pim listesi varsa dokunmaz (progressDecision sonucu zaten pime oturtur). */
function minPlate(){ return Math.min(...plateSet()); }
function loadStep(ex, cur){
  const lt = loadTypeOf(ex.id);
  if(lt === "off") return stepOf(ex, cur) || 2.5;
  return lt === "single" ? minPlate() : minPlate()*2;
}
function loadableRound(ex, w, cur){
  if(ladderOf(ex)) return w;
  const st = loadStep(ex, cur);
  return r2(Math.round(w/st + 1e-9) * st);
}
function easyJump(ex, cur, streak){
  const pct = EASY.pct[Math.min(streak, EASY.pct.length - 1)];
  const w = Math.max(loadableRound(ex, cur*(1+pct), cur), r2(cur + incOf(ex)*2));
  return {weight:w, pct};
}
/* Seans ici oneri: ilk set RPE <= 6 ise kalan setler icin +%15 */
function bumpTarget(ex, kg){
  if(kg == null) return null;
  const l = ladderOf(ex);
  if(l){
    const ups = l.filter(x => x > kg + 0.001);
    return ups.length ? nearestRung(ups, kg*(1+EASY.bumpPct)) : null;
  }
  return Math.max(loadableRound(ex, kg*(1+EASY.bumpPct), kg), r2(kg + incOf(ex)));
}
function canOfferBump(ex, en){
  if(!(ex.type === "sec" || ex.type === "sec4" || ex.type === "acc")) return false;
  if(ex.type === "acc" && isCoarse(ex, en.kg)) return false;
  if(en.kg == null || en.noBump || (en.bumps||0) >= EASY.maxBumps) return false;
  if(en.reps[0] == null || en.rpe[0] == null || en.rpe[0] > EASY.bumpRpe) return false;
  if(en.reps.slice(1).some(r => r != null)) return false;   // sadece ilk setten sonra
  const need = ex.type === "acc" ? (ex.min != null ? ex.min : Math.ceil((ex.total||0)/ex.sets)) : ex.target;
  return en.reps[0] >= need;
}

function progressDecisionRaw(ex, reps, rpeArr, cur, streak){
  if(cur == null) return {weight:null, tier:"nodata"};
  const inc = incOf(ex);
  const rpeVals = (rpeArr||[]).filter(v=>v!=null);
  const avgRpe = rpeVals.length ? Math.round(rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length*10)/10 : null;

  if(ex.type === "main" || ex.type === "sec" || ex.type === "sec4"){
    const lastIdx = Math.min(ex.sets-1, reps.length-1);
    const last = reps[lastIdx];
    if(last == null) return {weight:cur, tier:"incomplete"};
    if(last < ex.target){
      return {weight:Math.max(mround(cur*0.9, 2.5), 2.5), tier:"deload", last, avgRpe};
    }
    /* ZAYIF SET KORUMASI — son set hedefi tutsa bile, ONCEKI setlerden biri
       hedefin %70'inin altinda kaldiysa o agirlik henuz oturmamistir.
       (Ornek: 5 · 6 · 10 — son set uzun dinlenmeyle kurtarilmis.)
       Deload yok, sadece artis durur. Sadece sec/sec4'te: main tipinde
       ilk setler zaten sabit hedefle giriliyor. */
    if(ex.type === "sec" || ex.type === "sec4"){
      const prior = reps.slice(0, lastIdx).filter(r => r != null);
      const floorReps = ex.target * 0.7;
      const weak = prior.filter(r => r < floorReps);
      if(weak.length){
        return {weight:cur, tier:"hold_weak_sets", last, avgRpe,
                weakReps:weak, floorReps:Math.round(floorReps*10)/10};
      }
    }
    const ratio = last / ex.target;
    /* Hedefin 3 katindan fazla tekrar — agirlik gercekten geride kalmis,
       gercek performanstan yeniden hesapla (Epley), max %25 sicrama tavaniyla. */
    if(ratio >= 3){
      const est = mround(epley(cur, last) * ex.pct, 2.5);
      const cap = mround(cur*1.25, 2.5);
      const floor = cur + inc*2;
      const weight = Math.max(Math.min(est, cap), floor);
      return {weight, tier:"recalibrate", last, ratio, avgRpe, est, cap};
    }
    if(easyCriteria(ex, reps, rpeArr, cur)){
      const j = easyJump(ex, cur, streak || 0);
      return {weight:j.weight, tier:"easy_jump", pct:j.pct, streak:(streak||0)+1, last, ratio, avgRpe};
    }
    /* Hedefin 2-3 kati — RPE ne olursa olsun cift artis, tekrar sayisi
       kendi basina yeterli bir sinyal. */
    if(ratio >= 2){
      return {weight: cur + inc*2, tier:"bigjump", last, ratio, avgRpe};
    }
    if(avgRpe !== null && avgRpe >= 9.5) return {weight:cur, tier:"hold_high_rpe", last, avgRpe};
    if(avgRpe !== null && avgRpe <= 7)   return {weight:cur + inc*2, tier:"double_low_rpe", last, avgRpe};
    return {weight:cur + inc, tier:"normal", last, avgRpe};
  }

  if(ex.type === "acc"){
    /* Aralığin ALT sinirini her sette tutturmak basaridir (asagida). Artis
       miktari ise iki sinyalin karisimindan geliyor: en zayif setin araliktaki
       konumu (alt mi ust mu) + ortalama RPE. Boylece "12-15 tekrar" gibi
       araliklarda 12'ye yakin-zor ile 15'e yakin-kolay ayni artisi almiyor. */
    const minReps = ex.min != null ? ex.min : Math.ceil((ex.total||0) / ex.sets);
    const maxReps = ex.max != null ? ex.max : minReps;
    const filled = reps.filter(r => r != null);
    const sum = filled.reduce((a,b)=> a + b, 0);

    /* ---- KABA KADEME MODU -------------------------------------------
       Makinenin kademesi cok buyukse agirlik her antrenman artamaz.
       Bunun yerine cift ilerleme: once tekrarlar tavana tirmanir, tavan
       dolunca TEK SEFERDE tam bir kademe atlanir ve tekrarlar tabana doner.
       25 kg x 15 tekrar ile 30 kg x 8 tekrar birbirine cok yakin is. */
    if(isCoarse(ex, cur)){
      const st = stepOf(ex, cur);
      if(filled.length < ex.sets){
        const worstP = filled.length ? Math.min(...filled) : 0;
        return {weight:cur, tier:"coarse_partial", coarse:true, step:st,
                worst:worstP, minReps, maxReps, nextTarget:Math.max(minReps, worstP), avgRpe};
      }
      const worstC = Math.min(...filled);
      if(worstC >= maxReps){
        /* Tavan doldu — ama son setler RPE 9.5+ ise bir hafta daha bekle,
           kademe atlamak zaten buyuk bir sicrama. */
        if(avgRpe != null && avgRpe > 9){
          return {weight:cur, tier:"coarse_hold", coarse:true, step:st,
                  worst:worstC, minReps, maxReps, nextTarget:maxReps, avgRpe};
        }
        const lad = ladderOf(ex);
        const up = lad ? nextRung(lad, cur) : null;
        if(lad && up == null){   // listenin en tepesindesin — daha yuksek pim yok
          return {weight:cur, tier:"coarse_hold", coarse:true, step:st,
                  worst:worstC, minReps, maxReps, nextTarget:maxReps, avgRpe, topOfLadder:true};
        }
        const wNext = lad ? up : snapStep(cur + st, st);
        return {weight:wNext, tier:"coarse_step_up", coarse:true, step:st,
                worst:worstC, minReps, maxReps, nextTarget:minReps, avgRpe};
      }
      /* Tavan dolmadi — agirlik ayni, hedef en zayif setten bir fazlasi. */
      const nt = Math.min(maxReps, Math.max(minReps, worstC + 1));
      return {weight:cur, tier:"coarse_rep_up", coarse:true, step:st,
              worst:worstC, minReps, maxReps, nextTarget:nt, avgRpe};
    }

    const hit = filled.length >= ex.sets && filled.every(r => r >= minReps);
    if(!hit){
      const worst = filled.length ? Math.min(...filled) : 0;
      return {weight:cur, tier:"acc_missed", sum, minReps, worst, avgRpe};
    }
    const worst = Math.min(...filled);
    if(easyCriteria(ex, reps, rpeArr, cur)){
      const j = easyJump(ex, cur, streak || 0);
      return {weight:j.weight, tier:"easy_jump", pct:j.pct, streak:(streak||0)+1, sum, minReps, maxReps, worst, avgRpe};
    }
    const repPos = maxReps > minReps ? Math.max(0, Math.min(1, (worst-minReps)/(maxReps-minReps))) : 1;
    const rpePos = avgRpe != null ? Math.max(0, Math.min(1, (10-avgRpe)/4)) : repPos;
    const score = 0.4*repPos + 0.6*rpePos;
    let weight, tier;
    if(score >= 0.75){ weight = cur + inc*2;   tier = "acc_big"; }
    else if(score >= 0.45){ weight = cur + inc; tier = "acc_normal"; }
    else if(score >= 0.15){ weight = cur + inc/2; tier = "acc_small"; }
    else { weight = cur; tier = "acc_hold"; }
    return {weight, tier, sum, minReps, maxReps, worst, score, avgRpe};
  }

  return {weight:cur, tier:"other"};
}

function progress(ex, reps, rpeArr){
  return progressDecision(ex, reps, rpeArr).weight;
}

/* Kaba kademe modundaki hareketin BU antrenmandaki tekrar hedefi.
   Saklanmiyor — son antrenmanin karariyla geriye donuk turetiliyor,
   decisionNote ile ayni kaynaktan beslensin diye. */
function nextTargetReps(ex){
  if(!isCoarse(ex)) return null;
  for(let i=S.sessions.length-1; i>=0; i--){
    const e = S.sessions[i].entries[ex.id];
    if(e && e.kg != null && e.reps){
      const d = progressDecision(ex, e.reps, e.rpe, e.kg);
      if(d.nextTarget != null) return d.nextTarget;
      break;
    }
  }
  return ex.min != null ? ex.min : null;
}

/* =========================================================
   ISINMA — "SADECE EKLE"
   Isinma agirliklari yuzdeyle degil, calisma agirliginin PLAKA DIZILIMINDEN
   turetilir: once agir plakalar takilir, her isinma o dizilimin ilk birkac
   plakasidir. Isinmadan calismaya gecerken sadece plaka EKLENIR, hic
   cikarilmaz; toplam plaka hareketi calisma setindeki plaka sayisina iner.
   main: en fazla 2 isinma (~%40-72 ve ~%75-93), sec/sec4: 1 isinma (~%40-78),
   acc: isinma yok.
   ========================================================= */
const WU_RULES = {
  main: [ {lo:0.40, hi:0.72, ideal:0.55}, {lo:0.75, hi:0.93, ideal:0.85} ],
  sec:  [ {lo:0.40, hi:0.78, ideal:0.60} ],
};
function wuRulesOf(ex){
  if(ex.type === "main") return WU_RULES.main;
  if(ex.type === "sec" || ex.type === "sec4") return WU_RULES.sec;
  return [];
}
/* target'a (her taraf) tam esit, buyukten kucuge sirali plaka dizilimleri.
   En fazla maxCount plaka; arama kucuk (6 plaka cesidi), sonuc sayisi sinirli. */
function stackCandidates(target, maxCount){
  const ps = plateSet(), out = [];
  const tgt = Math.round(target*100);
  (function dfs(i, rem, cur){
    if(out.length >= 400) return;
    if(rem === 0){ out.push(cur.slice()); return; }
    if(cur.length >= maxCount) return;
    for(let k = i; k < ps.length; k++){
      const p = Math.round(ps[k]*100);
      if(p > rem) continue;
      if(p * (maxCount - cur.length) < rem) break;   // kalan yuvalar yetmez (daha kucukler hic yetmez)
      cur.push(ps[k]); dfs(k, rem - p, cur); cur.pop();
    }
  })(0, tgt, []);
  return out;
}
/* Bir dizilimin onekleri arasindan kurallara en uygun isinma duraklarini sec. */
function pickWarmPrefixes(stack, rules){
  const total = stack.reduce((a,b)=>a+b,0);
  if(total <= 0) return {picks:[], dist:0};
  const fr = [];   // fr[k-1] = ilk k plakanin orani (k = 1..n-1)
  let acc = 0;
  for(let k = 1; k < stack.length; k++){ acc += stack[k-1]; fr.push(acc/total); }
  /* Kurallar artan sirada; her biri bir oncekinden SONRAKI bir onek almali. */
  let best = {picks:[], dist:0};
  (function go(ri, minK, picks, dist){
    if(ri === rules.length){
      if(picks.length > best.picks.length || (picks.length === best.picks.length && dist < best.dist))
        best = {picks:picks.slice(), dist};
      return;
    }
    const r = rules[ri];
    go(ri+1, minK, picks, dist);                       // bu kurali bos gec
    for(let k = minK; k <= fr.length; k++){
      const f = fr[k-1];
      if(f < r.lo - 1e-9 || f > r.hi + 1e-9) continue;
      picks.push({k, f, rule:ri}); go(ri+1, k+1, picks, dist + Math.abs(f - r.ideal)); picks.pop();
    }
  })(0, 1, [], 0);
  return best;
}
/* Isinma + calisma plani. kg = toplam calisma agirligi (kayittaki deger).
   Donus: { plates:bool, stack:[her taraf, buyukten kucuge], per, steps:[...] }
   steps: isinmalar sirayla, en sonda calisma; her biri {kg, per, reps, count, work}
   count = o adimda takili plaka sayisi (stack'in ilk count plakasi). */
function warmPlan(ex, kg){
  if(kg == null || ex.type === "bw") return {plates:false, stack:[], per:null, steps:[]};
  const lt = loadTypeOf(ex.id);
  const rules = wuRulesOf(ex);
  const repsFor = (n, i) => ex.type === "main" ? (n === 1 ? 5 : [6,3][i]) : 8;

  if(lt === "off"){
    /* Pinli makine — plaka yok; yuzdeyle, makinede secilebilir degere oturt */
    const l = ladderOf(ex), st = stepOf(ex, kg) || 2.5;
    let ws = rules.map(r => {
      const raw = kg * r.ideal;
      return l ? (l.filter(x => x <= raw + 0.001).pop() ?? null) : Math.floor(raw/st + 1e-9)*st;
    }).filter(w => w != null && w > 0 && w < kg - 0.001);
    ws = ws.filter((w,i) => i === 0 || w > ws[i-1] + 0.001);
    const steps = ws.map((w,i) => ({kg:r2(w), per:null, reps:repsFor(ws.length, i), count:0, work:false}));
    steps.push({kg, per:null, reps:null, count:0, work:true});
    return {plates:false, stack:[], per:null, steps};
  }

  const per = perSideKg(ex.id, kg);
  const greedy = platesFor(per);
  const toTotal = p => r2(lt === "single" ? p : p*2);
  let stack = greedy.plates, picks = [];
  if(rules.length && stack.length){
    /* Adaylar: en az plakali dizilim ve bir fazlasi. Siralama:
       1) en az bir isinma bulunabilmeli, 2) daha az plaka, 3) daha cok isinma,
       4) alisilmis (aç gözlü) dizilim, 5) hedef oranlara yakinlik. */
    const n0 = greedy.plates.length;
    const gKey = greedy.plates.join(",");
    const cands = stackCandidates(greedy.exact, n0 + 1);
    if(!cands.length) cands.push(greedy.plates.slice());
    let bestKey = null;
    cands.forEach(c => {
      const pk = pickWarmPrefixes(c, rules);
      const key = [pk.picks.length ? 0 : 1, c.length, -pk.picks.length, c.join(",") === gKey ? 0 : 1, pk.dist];
      const better = !bestKey || key.some((v,i) => {
        for(let j = 0; j < i; j++) if(Math.abs(key[j]-bestKey[j]) > 1e-9) return false;
        return v < bestKey[i] - 1e-9;
      });
      if(better){ bestKey = key; stack = c; picks = pk.picks; }
    });
  }
  const steps = picks.map((p,i) => {
    const ps = r2(stack.slice(0, p.k).reduce((a,b)=>a+b,0));
    return {kg:toTotal(ps), per:ps, reps:repsFor(picks.length, picks.length === 1 ? (p.rule) : i), count:p.k, work:false};
  });
  steps.push({kg, per, reps:null, count:stack.length, work:true});
  return {plates:true, stack, per, exact:greedy.exact, left:greedy.left, steps};
}
/* Geriye uyum: sadece isinma agirliklari (toplam kg) */
function warmups(ex, kg){
  const w = kg != null ? kg : S.weights[ex.id];
  return warmPlan(ex, w).steps.filter(s => !s.work).map(s => s.kg);
}

/* =========================================================
   PLAKA HESAPLAYICI
   ========================================================= */
/* Dumbbell ve vücut ağırlığı hareketlerinde plaka takmıyorsun */
const NO_PLATES = ["b5","c5","b6","c6","b3","b4","a6"];   // b3/b4/a6: pinli makine (Cybex/True) — ekstra plaka yok
const ALL_PLATES = [25,20,15,10,5,2.5,2,1.25,1];
/* Plakalarda 1.25 gibi degerler var — fmtKg 1 ondalikla yuvarlayip 1.3 yapiyor */
const fmtP = v => (Math.round(v*100)/100).toString();
window.togglePlate = function(p){
  if(!S.plateSet) S.plateSet = [20,15,10,5,2.5,1.25];
  const i = S.plateSet.indexOf(p);
  if(i === -1) S.plateSet.push(p); else S.plateSet.splice(i,1);
  S.plateSet.sort((a,b)=>b-a); save(); render();
};

function loadTypeOf(exId){
  if(NO_PLATES.indexOf(exId) !== -1) return "off";
  if(S.loadTypes && S.loadTypes[exId]) return S.loadTypes[exId];
  return "total";                     // varsayilan: girilen kg hedef toplam, ikiye bolunur
}
window.setLoadType = function(exId, t){
  if(!S.loadTypes) S.loadTypes = {};
  S.loadTypes[exId] = t; save(); render();
};

function plateSet(){
  const p = (S.plateSet && S.plateSet.length ? S.plateSet : [20,15,10,5,2.5,1.25]).slice();
  return p.sort((a,b)=>b-a);
}

/* Aç gözlü dağıtım. Bu plaka setinde (her plaka kendinden küçüklerin katı)
   daima mümkün olan en az plaka sayısını verir. */
function platesFor(perSide){
  const out = [];
  let rem = Math.round(perSide*100)/100;
  for(const p of plateSet()){
    while(rem >= p - 0.001){ out.push(p); rem = Math.round((rem-p)*100)/100; }
  }
  return { plates: out, left: rem, exact: Math.round(out.reduce((a,b)=>a+b,0)*100)/100 };
}

/* Girilen kg -> bir tarafa düşen kg.
   Kayitli deger DAIMA toplamdir; plakali makinelerde ikiye bolunur. */
function perSideKg(exId, kg){
  return loadTypeOf(exId) === "single" ? kg : kg/2;
}

function plateCounts(list){
  const c = {}; list.forEach(p=>c[p]=(c[p]||0)+1); return c;
}

function plateListText(perSide){
  const r = platesFor(perSide);
  if(!r.plates.length) return T("boş");
  const c = plateCounts(r.plates);
  return Object.keys(c).map(Number).sort((a,b)=>b-a)
    .map(p => c[p]>1 ? c[p]+"×"+fmtP(p) : fmtP(p)).join("+");
}

/* İki ağırlık arasında hangi plakalar eklenir / çıkarılır.
   Onemli: hedefe MEVCUT plakalari koruyarak ulasilabiliyorsa o yol
   secilir. Aksi halde "12.5 -> 15" gecisinde 10 ve 2.5'i soktur, tek
   15'lik takar (3 hareket) — halbuki bir 2.5 eklemek yeter (1 hareket).
   Barda daha az plaka degil, elde daha az is hedefleniyor. */
function plateDiff(fromPerSide, toPerSide){
  const cur = platesFor(fromPerSide).plates;
  const need = Math.round((toPerSide - fromPerSide)*100)/100;

  /* Kilo artiyorsa: mevcutlarin ustune eklemeyi dene */
  if(need > 0){
    const r = platesFor(need);
    if(r.left <= 0.01){
      const c = plateCounts(r.plates);
      const add = Object.keys(c).map(Number).sort((x,y)=>y-x).map(p=>c[p]+"× "+fmtP(p));
      return { add, rem: [] };
    }
  }
  /* Kilo dusuyorsa: sadece cikarmayla ulasilabiliyor mu? */
  if(need < 0){
    const want = plateCounts(platesFor(-need).plates);
    const have = plateCounts(cur);
    const onlyRemove = Object.keys(want).every(p => (have[p]||0) >= want[p]);
    if(onlyRemove){
      const rem = Object.keys(want).map(Number).sort((x,y)=>y-x).map(p=>want[p]+"× "+fmtP(p));
      return { add: [], rem };
    }
  }

  /* Ulasilamadi — bastan diz (eski davranis) */
  const c = plateCounts(platesFor(toPerSide).plates);
  cur.forEach(p=>c[p]=(c[p]||0)-1);
  const add=[], rem=[];
  Object.keys(c).map(Number).sort((x,y)=>y-x).forEach(p=>{
    if(c[p]>0) add.push(c[p]+"× "+fmtP(p));
    if(c[p]<0) rem.push((-c[p])+"× "+fmtP(p));
  });
  return {add, rem};
}

/* Bu hareketin en son kaydedilmiş ağırlığı */
function lastKgFor(exId){
  for(let i=S.sessions.length-1;i>=0;i--){
    const e = S.sessions[i].entries[exId];
    if(e && e.kg != null) return e.kg;
  }
  return null;
}

/* Plakalarin gorsel dizilimi — sabit viewBox, boylece her agirlikta ayni olcek.
   status[i]: 'old' = zaten takili (gri), 'new' = simdi takilacak (amber),
   'ghost' = sonraki adimlarda takilacak (kesik cizgi). Verilmezse hepsi 'new'. */
function plateBarSVG(list, status, vbW){
  const H = 78, CY = 40, VW = vbW || 300;
  const hOf = p => 12 + 48*Math.pow(p/20, .6);
  const wOf = p => 7 + 9*Math.sqrt(p/20);
  let x = 16, parts = "";
  list.forEach((p, i)=>{
    const st = status ? status[i] : "new";
    const h = hOf(p), w = wOf(p);
    if(st === "ghost"){
      parts += `<rect x="${x+0.75}" y="${CY-h/2+0.75}" width="${w-1.5}" height="${h-1.5}" rx="2.5" fill="none"
        stroke="var(--plate-ghost)" stroke-width="1.5" stroke-dasharray="3 2.5"/>`;
    } else {
      const fill = st === "old" ? "var(--plate-old)" : (p >= 5 ? "var(--amber)" : "var(--amber-deep)");
      parts += `<rect x="${x}" y="${CY-h/2}" width="${w}" height="${h}" rx="2.5" fill="${fill}"/>`;
    }
    if(w >= 9 && h >= fmtP(p).length*5.3 + 2){     // yazi plakaya sigmiyorsa (1.25) etiketsiz
      const tc = st === "ghost" ? "var(--muted)" : st === "old" ? "var(--text)" : "#3A2604";
      parts += `<text x="${x+w/2}" y="${CY}" transform="rotate(-90 ${x+w/2} ${CY})"
      text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="700"
      fill="${tc}" font-family="ui-monospace,monospace">${fmtP(p)}</text>`;
    }
    x += w + 2;
  });
  const tail = Math.max(x + 26, 120);
  return `<svg width="100%" viewBox="0 0 ${VW} ${H}"
    preserveAspectRatio="xMinYMid meet" style="display:block" aria-hidden="true">
    <rect x="0" y="${CY-30}" width="7" height="60" rx="2.5" fill="var(--line-hi)"/>
    <rect x="7" y="${CY-4}" width="${tail-7}" height="8" rx="3" fill="var(--line-hi)"/>
    ${parts}
  </svg>`;
}

/* Plaka listesini gruplu yaz: [20,20,5] -> ["2×20","5"] */
function plateGroups(list){
  const c = plateCounts(list);
  return Object.keys(c).map(Number).sort((a,b)=>b-a).map(p => c[p] > 1 ? c[p]+"×"+fmtP(p) : fmtP(p));
}

/* Seans icinde agirlik artirildiysa makinede FIILEN takili olan dizilim:
   artirmadan onceki plakalar yerinde kalir, aradaki fark DISA eklenir.
   Fark sadece ekleyerek kurulamiyorsa (nadiren) dizilim bastan kurulur.
   Donus: {stack, nOld} — stack'in ilk nOld plakasi zaten takili. */
function bumpedStack(ex, en){
  if(!Array.isArray(en.loadedStack) || en.kg == null) return null;
  const per = perSideKg(ex.id, en.kg);
  const have = r2(en.loadedStack.reduce((a,b)=>a+b,0));
  const need = r2(per - have);
  if(need > 0.001){
    const add = platesFor(need);
    if(add.left <= 0.01) return {stack: en.loadedStack.concat(add.plates), nOld: en.loadedStack.length};
  }
  return {stack: warmPlan(ex, en.kg).stack, nOld: 0};
}
/* Calisma adiminda su an makinede olmasi gereken dizilim (her taraf) */
function workStackOf(ex, en){
  const b = bumpedStack(ex, en);
  return b ? b.stack : warmPlan(ex, en.kg).stack;
}

/* Hareket ekraninda hangi adim gosteriliyor (isinma 1, 2 … calisma).
   Kullanici bir sekmeye dokunduysa o; dokunmadiysa calisma setlerine
   baslandiginda calisma, baslanmadiysa ilk isinma. */
function wuStepOf(en, plan){
  const last = plan.steps.length - 1;
  if(en.wuStep != null) return Math.max(0, Math.min(last, en.wuStep));
  if(en.reps.some(r => r != null)) return last;
  return 0;
}
window.setWuStep = function(i){
  const en = live && live.entries[detailExId];
  if(!en) return;
  en.wuStep = i;
  save(); render();
};

/* ISINMA + PLAKA KARTI — tek buyuk bar, adim adim.
   Takili plakalar gri, bu adimda takilacaklar amber, sonra takilacaklar kesik
   cizgili. Isinmadan calismaya gecerken sadece plaka EKLENIR (warmPlan). */
function plateCard(ex, en){
  const kg = en.kg;
  if(ex.type === "bw" || kg == null) return "";
  const lt = loadTypeOf(ex.id);
  const hidden = lt === "off" && NO_PLATES.indexOf(ex.id) === -1;   // kullanici plaka hesabini kapatti
  const plan = warmPlan(ex, kg);
  const steps = plan.steps;
  const last = steps.length - 1;
  const s = wuStepOf(en, plan);
  const cur = steps[s];
  const isWork = cur.work;

  /* Pinli makine, isinmasi da yok — kart gereksiz */
  if(!plan.plates && last === 0){
    return hidden ? `<div class="plates" style="padding:8px 13px">
      <div class="ph" style="margin:0">
        <span class="lb">${T("PLAKA HESABI KAPALI")}</span>
        <div class="pmodes"><button onclick="event.stopPropagation();setLoadType('${ex.id}','total')">${T("aç")}</button></div>
      </div>
    </div>` : "";
  }

  const label = i => steps[i].work ? T("Çalışma") : T("Isınma {n}",{n:i+1});
  const tabs = last > 0 ? `<div class="wutabs" style="grid-template-columns:repeat(${steps.length},minmax(0,1fr))" role="group" aria-label="${T("Isınma adımları")}">${steps.map((st,i) =>
    `<button class="wutab ${i===s?'on':''}" aria-pressed="${i===s}" onclick="setWuStep(${i})">
      <span class="t">${label(i)}</span><span class="v">${fmtKg(st.kg)} kg</span>
    </button>`).join("")}</div>` : "";

  const repsTxt = isWork ? esc(ex.scheme) : "× " + cur.reps;
  const sideTxt = plan.plates && lt === "total"
    ? `<div class="wuside"><span class="k">${T("HER KOLA")}</span><span class="v">${fmtP(cur.per)} kg</span></div>` : "";
  const head = `<div class="wuhead">
      <div class="wubig"><span class="kg">${fmtKg(cur.kg)}<i>kg</i></span><span class="rp">${repsTxt}</span></div>
      ${sideTxt}
    </div>`;

  let bar = "", action = "", legend = "", approx = "", delta = "", bump = "";
  if(plan.plates){
    /* Varsayilan: isinma oneklerinden calismaya. Seans icinde artirildiysa
       calisma adimi, makinede takili olan dizilimin ustune eklemeyi gosterir. */
    let stack = plan.stack, prevCount = s > 0 ? steps[s-1].count : 0, upto = cur.count;
    const bs = isWork ? bumpedStack(ex, en) : null;
    if(bs){ stack = bs.stack; prevCount = bs.nOld; upto = bs.stack.length; }
    const status = stack.map((p,i) => i < prevCount ? "old" : i < upto ? "new" : "ghost");
    const fresh = stack.slice(prevCount, upto);
    bar = `<div class="wubar" role="img" aria-label="${esc(T("Her kola: takılı {a}; şimdi {b}",{
      a: prevCount ? plateGroups(stack.slice(0, prevCount)).join(" + ") : T("boş"),
      b: fresh.length ? plateGroups(fresh).join(" + ") : "—"}))}">${plateBarSVG(stack, status, 220)}</div>`;
    if(fresh.length){
      const verb = prevCount ? T("EKLE") : T("TAK");
      const chips = plateGroups(fresh).map(g => `<span class="wuchip">${prevCount ? "+ " : ""}${g}</span>`).join("");
      action = `<div class="wuact"><span class="verb">${verb}</span>${chips}<span class="cnt">${T("her kola")}</span></div>`;
    }
    if(last > 0) legend = `<div class="wuleg">
        <span><i class="sw old"></i>${T("Takılı")}</span>
        <span><i class="sw new"></i>${T("Şimdi tak")}</span>
        <span><i class="sw ghost"></i>${T("Sonra")}</span>
      </div>`;
    if(isWork && plan.left > 0.01){
      approx = `<div class="approx">${T("Tam tutmuyor — bu plakalarla her tarafa {a} kg olur ({b} kg eksik). Kayıt {c} kg olarak kalır.",{a:fmtP(plan.exact),b:fmtP(plan.left),c:fmtKg(kg)})}</div>`;
    }
    /* Isinmasi olmayan hareket: gecen seferle farki yine goster */
    if(last === 0){
      const lk = lastKgFor(ex.id);
      if(lk != null && Math.abs(lk - kg) > 0.001){
        const ref = perSideKg(ex.id, lk), per = perSideKg(ex.id, kg);
        const d = plateDiff(ref, per);
        const parts = [];
        if(d.add.length) parts.push(T("ekle")+" "+d.add.join(" + "));
        if(d.rem.length) parts.push(T("çıkar")+" "+d.rem.join(" + "));
        if(parts.length) delta = `<div class="delta ${per>ref?'up':'dn'}">${per>ref?'▲':'▼'} ${T("{ref}, her tarafa {parts}",{ref:T("Geçen sefere göre"),parts:parts.join(" · ")})}</div>`;
      }
    }
    /* Seans icinde agirlik artirildiysa bilgi satiri (ne eklenecegi barda) */
    if(isWork && en.bumpFrom != null && Math.abs(en.bumpFrom - kg) > 0.001){
      bump = `<div class="delta up">▲ ${T("Artırıldı: {a} → {b} kg",{a:fmtKg(en.bumpFrom),b:fmtKg(kg)})}</div>`;
    }
  } else if(isWork && en.bumpFrom != null && Math.abs(en.bumpFrom - kg) > 0.001){
    bump = `<div class="delta up">▲ ${T("Artırıldı: {a} → {b} kg",{a:fmtKg(en.bumpFrom),b:fmtKg(kg)})}</div>`;
  }

  const next = !isWork ? `<button class="wunext" onclick="setWuStep(${s+1})">${
      steps[s+1].work ? T("Isınma {n} tamam — çalışmaya geç",{n:s+1}) : T("Isınma {n} tamam — sonraki",{n:s+1})} <span class="chev">›</span></button>` : "";

  const foot = plan.plates ? `<div class="pfoot">
      <label><input type="checkbox" ${lt==='single'?'checked':''}
        onclick="event.stopPropagation();setLoadType('${ex.id}',this.checked?'single':'total')">
        ${T("Tek yükleme noktası var (plakalar ikiye bölünmesin)")}</label>
      <button class="phide" onclick="event.stopPropagation();setLoadType('${ex.id}','off')">${T("gizle")}</button>
    </div>` : hidden ? `<div class="pfoot"><label>${T("PLAKA HESABI KAPALI")}</label>
      <button class="phide" onclick="event.stopPropagation();setLoadType('${ex.id}','total')">${T("aç")}</button></div>` : "";

  return `<div class="plates wucard">
    ${tabs}${head}${bar}${action}${legend}${approx}${delta}${bump}${next}${foot}
  </div>`;
}

function seriesFor(exId){
  const out = [];
  S.sessions.forEach(s => {
    const e = s.entries[exId];
    if(!e || e.kg == null) return;
    const best = Math.max(0, ...(e.reps||[]).map(r=>r||0));
    out.push({ date:s.date, kg:e.kg, e1rm: best>0 ? epley(e.kg,best) : null,
               rpe: e.rpe && e.rpe.filter(v=>v!=null).length ?
                    e.rpe.filter(v=>v!=null).reduce((a,b)=>a+b,0)/e.rpe.filter(v=>v!=null).length : null });
  });
  return out;
}

/* Bir hareketin belirli bir tarihteki hacmi: kg x toplam tekrar */
function volumeOfEntry(exId, date){
  const s = S.sessions.find(x => x.date === date);
  const e = s && s.entries[exId];
  if(!e || e.kg == null) return 0;
  return (e.reps||[]).reduce((a,r)=> a + (r||0)*e.kg, 0);
}

function sessionVolume(s){
  return Object.keys(s.entries).reduce((t,id)=>{
    const e = s.entries[id]; if(!e || !e.kg) return t;
    return t + (e.reps||[]).reduce((a,r)=>a+((r||0)*e.kg),0);
  },0);
}

function sessionSets(s){
  return Object.keys(s.entries).reduce((t,id)=>{
    const e = s.entries[id]; if(!e) return t;
    return t + (e.reps||[]).filter(r=>r!=null).length;
  },0);
}

function daysAgo(d){
  const diff = Math.floor((Date.now() - new Date(d).getTime())/(86400000));
  if(diff === 0) return T("Bugün");
  if(diff === 1) return T("Dün");
  return T("{n} gün önce",{n:diff});
}

  const tests = {};
  allEx().forEach(ex => {
    if(ex.type === "bw") return;
    const w = pf(document.getElementById("tw_"+ex.id).value);
    const r = parseInt(document.getElementById("tr_"+ex.id).value,10);
    tests[ex.id] = [ (w>0?w:ex.test[0]), (r>0?r:ex.test[1]) ];
  });
  seedWeights(tests);
  S.bwLog.push({date:todayISO(), kg:S.bodyweight});
  S.setup = true;
  save(); render();
};

function miniSparkline(vals){
  if(vals.length<2) return "";
  const W=96,H=26,mn=Math.min(...vals),mx=Math.max(...vals);
  const rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-3-((v-mn)/rg)*(H-6)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="26" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function miniBars(vals){
  if(!vals.length) return "";
  const W=96,H=26,mx=Math.max(...vals)||1;
  const n=vals.length, bw=W/n*0.62, gap=W/n*0.38;
  let s="";
  vals.forEach((v,i)=>{
    const h=Math.max(2,(v/mx)*(H-2));
    s+=`<rect x="${(i*(bw+gap)).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="var(--amber)" opacity="${(0.35+0.65*(i+1)/n).toFixed(2)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="26" preserveAspectRatio="none">${s}</svg>`;
}
function ringSVG(done, total){
  const pct=Math.min(1,done/total);
  const c=2*Math.PI*11;
  return `<svg viewBox="0 0 26 26" width="26" height="26" style="transform:rotate(-90deg)">
    <circle cx="13" cy="13" r="11" fill="none" stroke="var(--card-2)" stroke-width="3.5"/>
    <circle cx="13" cy="13" r="11" fill="none" stroke="var(--amber)" stroke-width="3.5"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}" stroke-linecap="round"/>
  </svg>`;
}
function fmtDur(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

window.selectSet = function(i, mode){
  const en = live.entries[detailExId];
  padTarget.setIdx = i;
  /* mode acikca verilmisse ona uy; verilmemisse: bos set -> tekrar gir,
     dolu set -> tekrari DUZELTMEYE ac (yanlis basildiginda geri donebilmek icin). */
  padTarget.mode = mode || 'reps';
  render();
};

/* dir = +1 / -1. Pim listesi varsa bir onceki/sonraki pime gider; yoksa
   kaba kademede tam kademe, diger durumda 2.5 kg. */
window.adjustKg = function(dir){
  const en = live.entries[detailExId];
  const ex = findEx(detailExId);
  if(en.kg == null) return;
  const l = ladderOf(ex);
  if(l){
    const t = dir > 0 ? nextRung(l, en.kg) : prevRung(l, en.kg);
    if(t != null) en.kg = t;
  } else {
    const st = isCoarse(ex, en.kg) ? stepOf(ex, en.kg) : 2.5;
    en.kg = Math.max(0, r2(en.kg + dir*st));
  }
  if(en.loadedStack && bumpedStack(ex, en).nOld === 0) delete en.loadedStack;
  save();
  render();
};
/* Makinedeki gercek degeri elle yaz (46, 45.36, 46,5 …) */
window.editKg = function(){
  const en = live.entries[detailExId];
  const ex = findEx(detailExId);
  const raw = prompt(T("Bu hareket için kaç kg kullandın?"), fmtKg(en.kg));
  if(raw == null) return;
  const n = pf(raw);
  if(!(n > 0) || n > 1000){ alert(T("Geçerli bir sayı yaz (ör. 46 veya 45.36).")); return; }
  en.kg = r2(n);
  if(en.loadedStack && bumpedStack(ex, en).nOld === 0) delete en.loadedStack;
  const l = S.ladders && S.ladders[ex.id];
  if(l && l.length && l.indexOf(en.kg) === -1){
    if(confirm(T("{kg} kg pim listesinde yok. Listeye eklensin mi?",{kg:en.kg}))) addRung(ex.id, en.kg, true);
  }
  save();
  render();
};

/* "KOLAY GELDI" ONERISI — ilk set RPE <= 6 ile bitti. Kabul edilirse bu set
   isinma sayilir (silinir), agirlik artar ve setlere bastan baslanir.
   Tek bir kg alani oldugu icin farkli agirlikli setleri karistirmiyoruz. */
function bumpBanner(ex, en){
  const o = en.bumpOffer;
  if(!o || en.kg == null) return "";
  const pct = Math.round((o.to/en.kg - 1)*100);
  return `<div class="bumpbox" role="status">
    <div class="bt">${T("Kolay geldi!")}</div>
    <div class="bs">${T("İlk set RPE {r} ile bitti. Ağırlığı artıralım mı? <b>{a} → {b} kg</b> (+%{p}). Bu set ısınma sayılır, setlere {b} kg ile baştan başlarsın.",{r:en.rpe[0],a:fmtKg(en.kg),b:fmtKg(o.to),p:pct})}</div>
    <div class="bb">
      <button class="yes" onclick="acceptBump()">${T("Artır → {b} kg",{b:fmtKg(o.to)})}</button>
      <button class="no" onclick="declineBump()">${T("Böyle devam")}</button>
    </div>
  </div>`;
}
window.acceptBump = function(){
  const ex = findEx(detailExId);
  const en = live && live.entries[detailExId];
  if(!ex || !en || !en.bumpOffer) return;
  const to = en.bumpOffer.to;
  if(loadTypeOf(ex.id) !== "off") en.loadedStack = workStackOf(ex, en);   // artirmadan once takili plakalar
  if(en.bumpFrom == null) en.bumpFrom = en.kg;
  en.kg = to;
  en.bumps = (en.bumps||0) + 1;
  en.reps = new Array(ex.sets).fill(null);
  en.rpe  = new Array(ex.sets).fill(null);
  en.rest = [];
  delete en.bumpOffer;
  en.wuStep = 99;                              // kart dogrudan calisma adimini gostersin
  padTarget = { exId: detailExId, setIdx: 0, mode: 'reps' };
  native("haptic", {style:"medium"});
  save(); render();
};
window.declineBump = function(){
  const en = live && live.entries[detailExId];
  if(!en) return;
  en.noBump = true;
  delete en.bumpOffer;
  save(); render();
};

function renderRpePanel(ex, en){
